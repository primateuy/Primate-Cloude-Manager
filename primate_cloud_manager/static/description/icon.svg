<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Primate Cloud Manager</title>
  <!-- Fondo navy de marca -->
  <rect width="512" height="512" rx="112" fill="#0F2B33"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#pcmGrad)"/>

  <!-- Nube teal -->
  <path d="M168 300
           a64 64 0 0 1 8 -127
           a72 72 0 0 1 139 -18
           a56 56 0 0 1 21 145
           z"
        fill="#48B3A6"/>

  <!-- Barras de infraestructura (servidores) dentro de la nube -->
  <g fill="#0F2B33" opacity="0.92">
    <rect x="188" y="212" width="120" height="18" rx="9"/>
    <rect x="188" y="244" width="120" height="18" rx="9"/>
  </g>
  <!-- LEDs de los servidores -->
  <circle cx="300" cy="221" r="5" fill="#E3F3EF"/>
  <circle cx="300" cy="253" r="5" fill="#E3F3EF"/>

  <!-- Acento naranja (estado) -->
  <circle cx="356" cy="196" r="20" fill="#FF8A00" stroke="#0F2B33" stroke-width="6"/>

  <!-- Monograma sutil -->
  <text x="256" y="410" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" fill="#F4F6F6" letter-spacing="4">PCM</text>

  <defs>
    <linearGradient id="pcmGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173B45"/>
      <stop offset="1" stop-color="#0F2B33"/>
    </linearGradient>
  </defs>
</svg>
