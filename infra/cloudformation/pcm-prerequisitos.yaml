# =============================================================================
# pcm-prerequisitos.yaml — prerrequisitos de la cuenta AWS para PCM
# (Primate Cloud Manager, el módulo de Odoo con el que Primate gobierna sus
# servidores Odoo en AWS).
#
# QUÉ CREA (y nada más; no modifica ni importa ningún recurso existente):
#   1. Documento SSM «pcm-readonly-discovery»: el ÚNICO comando que PCM puede
#      correr en un servidor que NO montó PCM. Es un script fijo, sin
#      parámetros, de solo lectura (inventario de los Odoo del servidor).
#   2. Rol e instance profile «pcm-ssm-role»: el rol que llevan las EC2 que
#      SÍ monta PCM (agente SSM + subir/bajar dumps en buckets pcm-*).
#   3. Bucket «pcm-dumps-<cuenta>» (us-east-1): dumps a restaurar. Privado,
#      Block Public Access completo, cifrado SSE-S3, sin versionado, solo TLS;
#      lo de incoming/ se borra solo a los 7 días.
#   4. Managed policies «pcm-prod-readonly» y «pcm-prod-provision».
#   5. Usuarios IAM «pcm-prod-ro» y «pcm-prod-prov», cada uno con SOLO su
#      policy, sin acceso a la consola y SIN access keys (las crea un humano
#      después, en la consola, y las carga en PCM).
#
# EL MODELO DE SEGURIDAD, EN DOS IDEAS:
#   - La etiqueta «primate:managed_by = pcm» es la LLAVE: PCM sólo puede operar
#     recursos que la tengan, y la etiqueta sólo se puede poner EN EL MISMO
#     LLAMADO que crea el recurso. Nadie (ni estos usuarios) puede ponérsela o
#     sacársela a algo que ya existe: hay un Deny explícito.
#   - Dos usuarios separados a propósito. Juntos en uno, IAM evalúa SendCommand
#     por recurso (documento e instancia por separado) y la combinación de las
#     dos policies daría un shell arbitrario sobre un servidor ajeno.
#       pcm-prod-ro   → leer el inventario y correr SOLO el documento de lectura.
#       pcm-prod-prov → montar servidores NUEVOS (siempre con la llave) y
#                       operar sólo esos.
#
# CÓMO SE DESPLIEGA: CloudFormation → Create stack → Upload a template file →
# sin parámetros (todo sale de los pseudo-parámetros de la cuenta) → tildar
# «I acknowledge … IAM resources with custom names» (CAPABILITY_NAMED_IAM).
# Solo en us-east-1 (regla «SoloEnUsEast1»). Para otras regiones con
# servidores a leer: pcm-ssm-readonly.yaml (sólo el documento SSM).
# Verificación posterior, de solo lectura: verificar.sh en CloudShell.
#
# Esta plantilla se GENERA (generar.py) desde las policies y el documento
# versionados del repo de PCM: no se edita a mano.
# =============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: 'PCM - prerrequisitos de la cuenta productiva: documento SSM de solo lectura, rol/instance
  profile pcm-ssm-role, bucket pcm-dumps-<cuenta>, policies pcm-prod-readonly / pcm-prod-provision y sus
  dos usuarios IAM (sin consola, sin access keys). Generada por infra/cloudformation/generar.py: no editar
  a mano.'
Rules:
  SoloEnUsEast1:
    Assertions:
    - Assert:
        Fn::Equals:
        - Ref: AWS::Region
        - us-east-1
      AssertDescription: 'Esta plantilla se despliega en us-east-1 (el bucket del dump va en la misma
        región que el servidor). Para otras regiones con servidores: pcm-ssm-readonly.yaml.'
Resources:

  # Documento SSM de SOLO LECTURA. El script va en runCommand, línea por
  # línea: primero el inventario (PCM_DISCOVERY_JSON) y después el gemelo
  # completo (PCM_TWIN_B64 + PCM_TWIN_OK). Sin parámetros: no hay forma de
  # pasarle un comando. UpdateMethod NewVersion: actualizar crea versión.
  DocumentoLecturaPCM:
    Type: AWS::SSM::Document
    Properties:
      Name: pcm-readonly-discovery
      DocumentType: Command
      DocumentFormat: JSON
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: 'PCM: discovery de SOLO LECTURA (inventario F2 + gemelo exacto). Sin parámetros.
          No escribe nada en el servidor. Único SendCommand permitido por la policy pcm-prod-readonly.'
        parameters: {}
        mainSteps:
        - action: aws:runShellScript
          name: pcmReadonlyDiscovery
          inputs:
            timeoutSeconds: '600'
            runCommand:
            - '#!/bin/bash'
            - set -uo pipefail
            - python3 - <<'PCM_F2_PY'
            - '#!/usr/bin/env python3'
            - '# -*- coding: utf-8 -*-'
            - '"""Discovery de instancias Odoo en un servidor importado (F2).'
            - ''
            - =============================================================================
            - 'CONTRATO: SÓLO LECTURA. Este script corre por SSM, como root, en servidores'
            - 'ADOPTADOS: servidores productivos de clientes que PCM no creó. No escribe'
            - nada, no instala nada, no reinicia nada y no cambia ningún archivo, servicio,
            - base ni permiso.
            - ''
            - 'Todo lo que hace es LEER:'
            - '  - la lista de units de systemd  (systemctl list-units / show)'
            - '  - el odoo.conf de cada unit     (sólo las claves de la allowlist)'
            - '  - la versión de Odoo            (se lee release.py como texto, no se importa)'
            - '  - la lista de bases             (SELECT sobre pg_database)'
            - ''
            - Cualquier cambio que haga falta en uno de estos servidores tiene que pasar
            - primero por «Habilitar la gestión». Si alguna vez se agrega una línea que
            - escriba, este script deja de ser apto para servidores adoptados.
            - =============================================================================
            - ''
            - 'Las credenciales NO se leen: ``db_password`` y ``admin_passwd`` no están en la'
            - allowlist, así que se OMITEN (no se enmascaran). No se ejecuta el binario de
            - Odoo para saber la versión, porque eso correría código del cliente; se lee
            - '``odoo/release.py`` como texto.'
            - ''
            - 'Salida: una sola línea, ``PCM_DISCOVERY_JSON:<json>``. Las listas van acotadas'
            - para no pasar el tope de 24.000 caracteres de ``get_command_invocation``.
            - '"""'
            - import json
            - import os
            - import re
            - import subprocess
            - ''
            - MAX_UNITS = 30
            - MAX_DBS = 150
            - ''
            - '# Allowlist del odoo.conf: lo necesario para registrar la instancia. Sin'
            - '# db_password ni admin_passwd, a propósito.'
            - CONF_KEYS = ["data_dir", "db_user", "db_name", "db_host", "db_port",
            - '             "http_port", "xmlrpc_port", "addons_path", "dbfilter"]'
            - ''
            - ''
            - 'def correr(cmd, timeout=20):'
            - '    """Ejecuta un comando de LECTURA y devuelve (código, stdout)."""'
            - '    try:'
            - '        res = subprocess.run(cmd, capture_output=True, text=True,'
            - '                             timeout=timeout)'
            - '        return res.returncode, res.stdout'
            - '    except Exception as error:  # noqa: BLE001 - se informa, no se aborta'
            - '        return -1, str(error)'
            - ''
            - ''
            - 'def leer_conf(path):'
            - '    """Lee SÓLO las claves de la allowlist de un odoo.conf."""'
            - '    datos = {}'
            - '    try:'
            - '        with open(path, encoding="utf-8", errors="replace") as fh:'
            - '            for linea in fh:'
            - '                m = re.match(r"^\s*([a-z_]+)\s*=\s*(.*?)\s*$", linea)'
            - '                if m and m.group(1) in CONF_KEYS:'
            - '                    datos[m.group(1)] = m.group(2)'
            - '    except OSError as error:'
            - '        return None, str(error)'
            - '    return datos, None'
            - ''
            - ''
            - 'def version_odoo(exec_start):'
            - '    """Versión mayor de Odoo leyendo release.py como TEXTO (no se importa)."""'
            - '    for token in exec_start.split():'
            - '        if not re.search(r"(odoo-bin|openerp-server|odoo\.py)$", token):'
            - '            continue'
            - '        base = os.path.dirname(token.strip("\"''"))'
            - '        for rel in ("odoo/release.py", "openerp/release.py"):'
            - '            ruta = os.path.join(base, rel)'
            - '            try:'
            - '                with open(ruta, encoding="utf-8", errors="replace") as fh:'
            - '                    m = re.search(r"version_info\s*=\s*\(\s*(?:''saas~)?(\d+)",'
            - '                                  fh.read())'
            - '                if m:'
            - '                    return m.group(1)'
            - '            except OSError:'
            - '                continue'
            - '    return None'
            - ''
            - ''
            - 'def units_odoo():'
            - '    """Units de systemd cuyo nombre menciona odoo, con su conf y estado."""'
            - '    codigo, salida = correr(["systemctl", "list-units", "--type=service",'
            - '                             "--all", "--no-legend", "--plain"])'
            - '    if codigo != 0:'
            - '        return [], "systemctl no disponible: %s" % salida[:200]'
            - '    nombres = [ln.split()[0] for ln in salida.splitlines()'
            - '               if ln.strip() and re.search(r"odoo|openerp", ln.split()[0], re.I)]'
            - '    units = []'
            - '    for nombre in nombres[:MAX_UNITS]:'
            - '        _c, props = correr(["systemctl", "show", nombre, "-p", "ExecStart",'
            - '                            "-p", "ActiveState", "-p", "User"])'
            - '        info = dict(ln.split("=", 1) for ln in props.splitlines() if "=" in ln)'
            - '        exec_start = info.get("ExecStart", "")'
            - '        # ExecStart viene como "{ path=... ; argv[]=... ; ... }": el argv manda.'
            - '        argv = re.search(r"argv\[\]=([^;]*)", exec_start)'
            - '        linea = argv.group(1).strip() if argv else exec_start'
            - '        conf = re.search(r"(?:-c|--config)(?:=|\s+)(\S+)", linea)'
            - '        unit = {'
            - '            "unit": nombre,'
            - '            "active": info.get("ActiveState", ""),'
            - '            "user": info.get("User", ""),'
            - '            "exec": linea[:300],'
            - '            "conf_path": conf.group(1).strip("\"''") if conf else None,'
            - '            # El puerto puede venir por argumento y pisar el del conf.'
            - '            "port_arg": (lambda p: p.group(1) if p else None)(re.search('
            - '                r"--(?:http|xmlrpc)-port(?:=|\s+)(\d+)", linea)),'
            - '            "version": version_odoo(linea),'
            - '        }'
            - '        if unit["conf_path"]:'
            - '            datos, error = leer_conf(unit["conf_path"])'
            - '            unit["conf"] = datos'
            - '            unit["conf_error"] = error'
            - '        units.append(unit)'
            - '    return units, None'
            - ''
            - ''
            - 'def bases():'
            - '    """Bases no-template con su dueño (para asociarlas a su instancia)."""'
            - '    codigo, salida = correr(['
            - '        "sudo", "-u", "postgres", "psql", "-tAF|", "-c",'
            - '        "SELECT d.datname, pg_get_userbyid(d.datdba) FROM pg_database d "'
            - '        "WHERE NOT d.datistemplate AND d.datname <> ''postgres'' "'
            - '        "ORDER BY d.datname"])'
            - '    if codigo != 0:'
            - '        return [], "no se pudieron listar las bases: %s" % salida[:200]'
            - '    filas = []'
            - '    for ln in salida.splitlines()[:MAX_DBS]:'
            - '        if "|" in ln:'
            - '            nombre, dueno = ln.split("|", 1)'
            - '            filas.append({"name": nombre.strip(), "owner": dueno.strip()})'
            - '    return filas, None'
            - ''
            - ''
            - 'def main():'
            - '    units, error_units = units_odoo()'
            - '    dbs, error_dbs = bases()'
            - '    print("PCM_DISCOVERY_JSON:" + json.dumps({'
            - '        "units": units, "units_error": error_units,'
            - '        "databases": dbs, "databases_error": error_dbs,'
            - '    }, separators=(",", ":"), ensure_ascii=False))'
            - ''
            - ''
            - 'if __name__ == "__main__":'
            - '    main()'
            - PCM_F2_PY
            - '# pcm_readonly_discovery.sh — Gemelo exacto (punto 3, 2026-10-22).'
            - '#'
            - '# SOLO LECTURA por construcción: comandos fijos de consulta, SIN parámetros,'
            - '# sin escribir NADA en el servidor (la salida va por stdout, gzip+base64).'
            - '# Es el ÚNICO contenido del documento SSM pcm-readonly-discovery con el que'
            - '# la policy pcm-prod-readonly permite SendCommand: aunque la credencial se'
            - '# filtre, con ella no se puede ejecutar otra cosa en los servidores.'
            - '#'
            - '# Salida: una línea  PCM_TWIN_B64:<base64(gzip(json))>  con el gemelo:'
            - '# sistema, y por cada Odoo (conf en /etc/odoo/*.conf o /etc/odoo.conf):'
            - '# conf enmascarado, addons_path en orden, unit systemd, core/enterprise'
            - '# (versión+commit), python+pip freeze, repos git (remote, rama, SHA,'
            - '# submódulos, sucio/no pusheado), base (versión PG, tamaño, filestore),'
            - '# nginx (vhosts, dominios, certificados y vencimiento), crons del sistema.'
            - '#'
            - '# Por ssh, desde la máquina del operador (el script viaja por stdin, no se'
            - '# copia al servidor, y el gemelo vuelve por stdout):'
            - '#   ssh <host> ''sudo bash -s'' < pcm_readonly_discovery.sh > gemelo.txt'
            - set -uo pipefail
            - export LC_ALL=C
            - '# Lecturas que escriben como efecto lateral, apagadas: `git status` refresca'
            - '# .git/index (y toma index.lock) y Python deja .pyc al importar pip.'
            - export GIT_OPTIONAL_LOCKS=0 PYTHONDONTWRITEBYTECODE=1
            - export PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_CACHE_DIR=1
            - ''
            - python3 - <<'PCM_TWIN_PY'
            - import base64
            - import configparser
            - import glob
            - import gzip
            - import json
            - import os
            - import re
            - import subprocess
            - ''
            - ''
            - 'def sh(cmd, cwd=None, timeout=30):'
            - '    """Comando FIJO de consulta; cualquier fallo devuelve ''''."""'
            - '    try:'
            - '        out = subprocess.run('
            - '            cmd, shell=True, cwd=cwd, timeout=timeout,'
            - '            capture_output=True, text=True)'
            - '        return (out.stdout or "").strip()'
            - '    except Exception:'
            - '        return ""'
            - ''
            - ''
            - MASCARA = ("admin_passwd", "db_password", "smtp_password", "password")
            - ''
            - ''
            - 'def leer_conf(path):'
            - '    conf = configparser.ConfigParser(strict=False, interpolation=None)'
            - '    try:'
            - '        conf.read(path)'
            - '    except Exception:'
            - '        return {}, {}'
            - '    opts = dict(conf["options"]) if conf.has_section("options") else {}'
            - '    enmascarado = {'
            - '        k: ("******" if any(m in k for m in MASCARA) and v not in ("", "False")'
            - '            else v)'
            - '        for k, v in sorted(opts.items())}'
            - '    return opts, enmascarado'
            - ''
            - ''
            - 'def git_info(path):'
            - '    if not os.path.isdir(os.path.join(path, ".git")) and not os.path.isfile('
            - '            os.path.join(path, ".git")):'
            - '        return None'
            - '    info = {'
            - '        "path": path,'
            - '        "remote_url": sh("git -c safe.directory=''*'' config --get remote.origin.url",
              cwd=path),'
            - '        "branch": sh("git -c safe.directory=''*'' rev-parse --abbrev-ref HEAD", cwd=path),'
            - '        "commit_sha": sh("git -c safe.directory=''*'' rev-parse HEAD", cwd=path),'
            - '        "commit_date": sh("git -c safe.directory=''*'' log -1 --format=%cI", cwd=path),'
            - '        "submodules": [l.strip() for l in sh('
            - '            "git submodule status", cwd=path).splitlines() if l.strip()],'
            - '    }'
            - '    porcelain = sh("git -c safe.directory=''*'' status --porcelain", cwd=path)'
            - '    info["dirty_files"] = len([l for l in porcelain.splitlines() if l.strip()])'
            - '    ahead = sh("git -c safe.directory=''*'' rev-list --count @{u}..HEAD", cwd=path)'
            - '    info["unpushed_commits"] = int(ahead) if ahead.isdigit() else None'
            - '    info["alert_local_changes"] = bool('
            - '        info["dirty_files"] or (info["unpushed_commits"] or 0) > 0)'
            - '    return info'
            - ''
            - ''
            - 'def version_odoo(src_dir):'
            - '    rel = os.path.join(src_dir, "odoo", "release.py")'
            - '    data = {"path": src_dir}'
            - '    if os.path.isfile(rel):'
            - '        txt = open(rel, encoding="utf-8", errors="replace").read()'
            - '        m = re.search(r"version_info\s*=\s*\(([^)]*)\)", txt)'
            - '        v = re.search(r"^version\s*=\s*[''\"]([^''\"]+)", txt, re.M)'
            - '        data["release"] = (v.group(1) if v else (m.group(1) if m else "?"))'
            - '    g = git_info(src_dir)'
            - '    if g:'
            - '        data.update({"commit_sha": g["commit_sha"], "branch": g["branch"]})'
            - '    return data'
            - ''
            - ''
            - 'def argv_de(execstart):'
            - '    """El comando real de un ExecStart de systemd: viene como'
            - '    «{ path=… ; argv[]=python odoo-bin -c x.conf ; … }»; si no trae argv[],'
            - '    es la línea tal cual."""'
            - '    m = re.search(r"argv\[\]=([^;]*)", execstart or "")'
            - '    return (m.group(1) if m else (execstart or "")).strip()'
            - ''
            - ''
            - 'def unit_de(conf_path):'
            - '    """La unit systemd cuyo ExecStart usa este conf (y su python/odoo-bin)."""'
            - '    for unit in sh("systemctl list-units --type=service --all --no-legend "'
            - '                   "--plain ''odoo*''").splitlines():'
            - '        name = unit.split()[0] if unit.split() else ""'
            - '        if not name:'
            - '            continue'
            - '        execstart = sh("systemctl show -p ExecStart --value %s" % name)'
            - '        if conf_path in execstart:'
            - '            trozos = argv_de(execstart).split()'
            - '            python_bin = next((t for t in trozos if "python" in t), "")'
            - '            odoo_bin = next((t for t in trozos if "odoo-bin" in t'
            - '                             or t.endswith("odoo")), "")'
            - '            return {"unit": name, "python_bin": python_bin,'
            - '                    "odoo_bin": odoo_bin,'
            - '                    "active": sh("systemctl is-active %s" % name),'
            - '                    "enabled": sh("systemctl is-enabled %s" % name)}'
            - '    return {}'
            - ''
            - ''
            - 'def nginx_info():'
            - '    sitios = []'
            - '    for site in sorted(glob.glob("/etc/nginx/sites-enabled/*")):'
            - '        txt = ""'
            - '        try:'
            - '            txt = open(site, encoding="utf-8", errors="replace").read()'
            - '        except Exception:'
            - '            pass'
            - '        nombres = re.findall(r"server_name\s+([^;]+);", txt)'
            - '        certs = re.findall(r"ssl_certificate\s+([^;]+);", txt)'
            - '        upstreams = re.findall(r"proxy_pass\s+http://127\.0\.0\.1:(\d+)", txt)'
            - '        cert_info = []'
            - '        for cert in {c.strip() for c in certs}:'
            - '            end = sh("openssl x509 -enddate -noout -in %s" % cert)'
            - '            cert_info.append({"path": cert.strip(),'
            - '                              "not_after": end.replace("notAfter=", "")})'
            - '        sitios.append({"site": os.path.basename(site),'
            - '                       "server_names": " ".join(n.strip() for n in nombres),'
            - '                       "proxy_ports": sorted(set(upstreams)),'
            - '                       "certificates": cert_info})'
            - '    return sitios'
            - ''
            - ''
            - 'def db_info(opts):'
            - '    db = opts.get("db_name") or ""'
            - '    if not db or db in ("False",):'
            - '        return {}'
            - '    size = sh("sudo -u postgres psql -tAc "'
            - '              "\"SELECT pg_database_size(''%s'')\"" % db)'
            - '    return {'
            - '        "db_name": db,'
            - '        "pg_version": sh("sudo -u postgres psql -tAc ''SHOW server_version''"),'
            - '        "db_size_bytes": int(size) if size.isdigit() else None,'
            - '    }'
            - ''
            - ''
            - 'def filestore_info(opts):'
            - '    data_dir = opts.get("data_dir") or ""'
            - '    db = opts.get("db_name") or ""'
            - '    ruta = os.path.join(data_dir, "filestore", db) if data_dir and db else ""'
            - '    if not ruta or not os.path.isdir(ruta):'
            - '        return {"path": ruta or None}'
            - '    du = sh("du -sb %s" % ruta, timeout=120).split()'
            - '    return {"path": ruta,'
            - '            "size_bytes": int(du[0]) if du and du[0].isdigit() else None}'
            - ''
            - ''
            - twin = {
            - '    "twin_format": 1,'
            - '    "host": sh("hostname"),'
            - '    "system": {'
            - '        "os": sh(". /etc/os-release && echo $PRETTY_NAME"),'
            - '        "kernel": sh("uname -r"),'
            - '        "packages": {p: sh("dpkg-query -W -f=''${Version}'' %s 2>/dev/null" % p)'
            - '                     for p in ("nginx", "postgresql", "certbot",'
            - '                               "python3", "wkhtmltopdf")},'
            - '        "cron_system": sh("cat /etc/crontab 2>/dev/null"),'
            - '        "cron_d": sorted(os.path.basename(f)'
            - '                         for f in glob.glob("/etc/cron.d/*")),'
            - '        "cron_root": sh("crontab -l -u root 2>/dev/null"),'
            - '    },'
            - '    "instances": [],'
            - '}'
            - ''
            - confs = sorted(glob.glob("/etc/odoo/*.conf"))
            - 'if os.path.isfile("/etc/odoo.conf"):'
            - '    confs.append("/etc/odoo.conf")'
            - 'for conf_path in confs:'
            - '    opts, masked = leer_conf(conf_path)'
            - '    addons = [p for p in (opts.get("addons_path") or "").split(",") if p]'
            - '    unit = unit_de(conf_path)'
            - '    venv_python = unit.get("python_bin") or ""'
            - '    repos, core, enterprise = [], None, None'
            - '    for ruta in addons:'
            - '        ruta = ruta.strip().rstrip("/")'
            - '        base = ruta'
            - '        # El core suele entrar como <src>/addons y <src>/odoo/addons.'
            - '        if base.endswith("/addons"):'
            - '            padre = os.path.dirname(base)'
            - '            if os.path.isfile(os.path.join(padre, "odoo-bin")):'
            - '                core = core or version_odoo(padre)'
            - '                continue'
            - '            abuelo = os.path.dirname(padre)'
            - '            if padre.endswith("/odoo") and os.path.isfile('
            - '                    os.path.join(abuelo, "odoo-bin")):'
            - '                core = core or version_odoo(abuelo)'
            - '                continue'
            - '        if os.path.basename(base) == "enterprise" or "enterprise" in base:'
            - '            g = git_info(base)'
            - '            if g:'
            - '                enterprise = g'
            - '                continue'
            - '        g = git_info(base)'
            - '        if g:'
            - '            repos.append(g)'
            - '        else:'
            - '            repos.append({"path": base, "remote_url": None,'
            - '                          "alert_local_changes": False,'
            - '                          "note": "sin git (carpeta suelta)"})'
            - '    twin["instances"].append({'
            - '        "conf_path": conf_path,'
            - '        "conf_masked": masked,'
            - '        "addons_path": addons,'
            - '        "workers": opts.get("workers"),'
            - '        "limits": {k: v for k, v in opts.items() if k.startswith("limit_")},'
            - '        "service": unit,'
            - '        "odoo_core": core,'
            - '        "odoo_enterprise": enterprise,'
            - '        "python": {'
            - '            "bin": venv_python,'
            - '            "version": sh("%s --version" % venv_python) if venv_python else "",'
            - '            "pip_freeze": sh("%s -m pip freeze 2>/dev/null" % venv_python,'
            - '                             timeout=120) if venv_python else "",'
            - '        },'
            - '        "database": db_info(opts),'
            - '        "filestore": filestore_info(opts),'
            - '        "repos": repos,'
            - '    })'
            - ''
            - twin["nginx"] = nginx_info()
            - blob = base64.b64encode(gzip.compress(
            - '    json.dumps(twin, ensure_ascii=False).encode())).decode()'
            - '# En trozos de 4000 para esquivar límites de línea; el parser los re-une.'
            - 'for i in range(0, len(blob), 4000):'
            - '    print("PCM_TWIN_B64:%s" % blob[i:i + 4000])'
            - print("PCM_TWIN_OK")
            - PCM_TWIN_PY

  # Rol de las EC2 que monta PCM. AmazonSSMManagedInstanceCore habilita el
  # agente SSM (PCM nunca usa SSH); la inline permite subir/bajar dumps y
  # backups en buckets pcm-*. No lo usan los servidores importados.
  RolSSM:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pcm-ssm-role
      Description: 'PCM: rol de las EC2 que monta PCM (agente SSM + subir/bajar dumps en buckets pcm-*).'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
      - PolicyName: PcmS3BackupObjects
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: PcmS3BackupObjects
            Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            Resource: arn:aws:s3:::pcm-*/*

  # Instance profile con el mismo nombre del rol (es lo que se le pasa a
  # RunInstances; pcm-prod-prov sólo puede pasar este rol).
  PerfilSSM:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: pcm-ssm-role
      Roles:
      - Ref: RolSSM

  # Bucket de dumps a restaurar. Retain: borrar el stack NO borra el bucket.
  # Sin VersioningConfiguration = sin versionado (lo que PCM borra al
  # terminar un restore se borra de verdad). incoming/ expira a los 7 días
  # y los multipart incompletos a 1 día.
  BucketDumps:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: pcm-dumps-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: incoming-7-dias
          Status: Enabled
          Prefix: incoming/
          ExpirationInDays: 7
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1

  # Rechaza cualquier acceso al bucket que no venga por TLS.
  BucketDumpsSoloTLS:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: BucketDumps
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: SoloConTLS
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::pcm-dumps-${AWS::AccountId}
          - Fn::Sub: arn:${AWS::Partition}:s3:::pcm-dumps-${AWS::AccountId}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'

  # pcm-prod-readonly: leer el inventario (EC2, RDS, Route 53, CloudWatch,
  # costos) y correr SÓLO el documento de lectura. Los Deny explícitos son
  # una segunda red: aunque alguien le sumara otra policy a este usuario,
  # lo que no es de PCM sigue intocable.
  PolicyReadonly:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: pcm-prod-readonly
      Description: 'PCM: inventario, importacion y gemelo de SOLO LECTURA.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        # Lecturas del inventario (Describe/List/Get). Nada escribe.
        - Sid: LecturaInventario
          Effect: Allow
          Action:
          - sts:GetCallerIdentity
          - ec2:DescribeInstances
          - ec2:DescribeInstanceStatus
          - ec2:DescribeRegions
          - ec2:DescribeAvailabilityZones
          - ec2:DescribeVpcs
          - ec2:DescribeSubnets
          - ec2:DescribeSecurityGroups
          - ec2:DescribeImages
          - ec2:DescribeVolumes
          - ec2:DescribeAddresses
          - ec2:DescribeTags
          - ec2:DescribeInstanceTypes
          - ec2:DescribeKeyPairs
          - rds:DescribeDBInstances
          - rds:DescribeDBSnapshots
          - rds:ListTagsForResource
          - route53:ListHostedZones
          - route53:GetHostedZone
          - route53:ListResourceRecordSets
          - route53:GetChange
          - cloudwatch:GetMetricData
          - cloudwatch:GetMetricStatistics
          - cloudwatch:ListMetrics
          - ce:GetCostAndUsage
          - ssm:DescribeInstanceInformation
          - ssm:GetCommandInvocation
          - ssm:ListCommands
          - ssm:ListCommandInvocations
          - ssm:DescribeDocument
          - ssm:GetDocument
          Resource: '*'
        # SendCommand SÓLO con el documento propio; ningún otro documento está permitido.
        - Sid: DiscoverySoloConElDocumentoPropio
          Effect: Allow
          Action: ssm:SendCommand
          Resource:
          - Fn::Sub: arn:aws:ssm:*:${AWS::AccountId}:document/pcm-readonly-discovery
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
        # Deny: ninguna acción de ciclo de vida, red ni discos sobre lo que no tiene la llave.
        - Sid: MaquinasNoCreadasPorPCMIntocables
          Effect: Deny
          Action:
          - ec2:StartInstances
          - ec2:StopInstances
          - ec2:RebootInstances
          - ec2:TerminateInstances
          - ec2:ModifyInstanceAttribute
          - ec2:ModifyInstanceMetadataOptions
          - ec2:AssociateIamInstanceProfile
          - ec2:ReplaceIamInstanceProfileAssociation
          - ec2:AttachVolume
          - ec2:DetachVolume
          - ec2:DeleteVolume
          - ec2:ModifyVolume
          - ec2:CreateSnapshot
          - ec2:AssociateAddress
          - ec2:DisassociateAddress
          - ec2:ReleaseAddress
          - ec2:AuthorizeSecurityGroupIngress
          - ec2:AuthorizeSecurityGroupEgress
          - ec2:RevokeSecurityGroupIngress
          - ec2:RevokeSecurityGroupEgress
          - ec2:DeleteSecurityGroup
          - ec2:DeleteTags
          Resource: '*'
          Condition:
            StringNotEquals:
              aws:ResourceTag/primate:managed_by: pcm
        # Deny: no etiquetar recursos ajenos (salvo dentro de una creación).
        - Sid: EtiquetasDeLoAjenoIntocables
          Effect: Deny
          Action: ec2:CreateTags
          Resource: '*'
          Condition:
            StringNotEquals:
              aws:ResourceTag/primate:managed_by: pcm
              ec2:CreateAction:
              - RunInstances
              - CreateVolume
              - CreateSecurityGroup
              - AllocateAddress
        # Deny: las RDS ajenas no se tocan.
        - Sid: BasesRdsNoCreadasPorPCMIntocables
          Effect: Deny
          Action:
          - rds:ModifyDBInstance
          - rds:DeleteDBInstance
          - rds:RebootDBInstance
          - rds:StopDBInstance
          - rds:StartDBInstance
          - rds:RestoreDBInstanceFromDBSnapshot
          - rds:AddTagsToResource
          - rds:RemoveTagsFromResource
          Resource: '*'
          Condition:
            StringNotEquals:
              rds:db-tag/primate:managed_by: pcm
        # Deny: sin sesiones, automatizaciones, documentos, parámetros, zonas ni IAM.
        - Sid: SinSesionesNiAutomatizacionesNiDocumentos
          Effect: Deny
          Action:
          - ssm:StartSession
          - ssm:ResumeSession
          - ssm:StartAutomationExecution
          - ssm:CreateDocument
          - ssm:UpdateDocument
          - ssm:UpdateDocumentDefaultVersion
          - ssm:DeleteDocument
          - ssm:ModifyDocumentPermission
          - ssm:CreateAssociation
          - ssm:UpdateAssociation
          - ssm:PutParameter
          - route53:CreateHostedZone
          - route53:DeleteHostedZone
          - route53domains:*
          - organizations:*
          - account:*
          - iam:Create*
          - iam:Delete*
          - iam:Put*
          - iam:Attach*
          - iam:Detach*
          - iam:Update*
          - iam:Add*
          - iam:Remove*
          - iam:Tag*
          - iam:Untag*
          - iam:Set*
          - iam:Upload*
          - iam:Enable*
          - iam:Deactivate*
          - iam:Reset*
          - iam:Change*
          Resource: '*'
        # Deny: la llave primate:managed_by (cualquier mayúscula) sólo nace al crear.
        - Sid: NadieTocaLaLlaveDePropiedadEnRecursosExistentes
          Effect: Deny
          Action:
          - ec2:CreateTags
          - ec2:DeleteTags
          Resource: '*'
          Condition:
            ForAnyValue:StringEqualsIgnoreCase:
              aws:TagKeys:
              - primate:managed_by
            StringNotEquals:
              ec2:CreateAction:
              - RunInstances
              - CreateVolume
              - CreateSecurityGroup
              - AllocateAddress
        # Deny: ningún DeleteTags (uno sin claves borraría la llave sin nombrarla).
        - Sid: NuncaBorrarEtiquetas
          Effect: Deny
          Action: ec2:DeleteTags
          Resource: '*'

  # pcm-prod-provision: montar servidores NUEVOS (siempre con la llave) y
  # operar sólo esos. Todo Allow de escritura exige la etiqueta
  # primate:managed_by=pcm en el pedido o en el recurso.
  PolicyProvision:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: pcm-prod-provision
      Description: 'PCM: montar SOLO lo nuevo (etiquetado primate:managed_by=pcm).'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        # Lecturas necesarias para montar y operar. Nada escribe.
        - Sid: LecturasParaOperarLoPropio
          Effect: Allow
          Action:
          - sts:GetCallerIdentity
          - ec2:DescribeInstances
          - ec2:DescribeInstanceStatus
          - ec2:DescribeRegions
          - ec2:DescribeAvailabilityZones
          - ec2:DescribeVpcs
          - ec2:DescribeSubnets
          - ec2:DescribeSecurityGroups
          - ec2:DescribeImages
          - ec2:DescribeVolumes
          - ec2:DescribeAddresses
          - ec2:DescribeTags
          - ec2:DescribeInstanceTypes
          - ec2:DescribeKeyPairs
          - ec2:DescribeRouteTables
          - route53:GetHostedZone
          - route53:GetChange
          - route53:ListResourceRecordSets
          - cloudwatch:GetMetricData
          - cloudwatch:GetMetricStatistics
          - ce:GetCostAndUsage
          - ssm:DescribeInstanceInformation
          - ssm:GetCommandInvocation
          - ssm:ListCommandInvocations
          - ssm:GetParameter
          - iam:GetInstanceProfile
          Resource: '*'
        # RunInstances sólo si la instancia y su volumen nacen con la llave.
        - Sid: CrearInstanciaSoloEtiquetadaPorPCM
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:volume/*
          Condition:
            StringEquals:
              aws:RequestTag/primate:managed_by: pcm
        # Lo que RunInstances usa sin crear (AMI, subred, interfaz, SG, key pair).
        - Sid: RecursosAuxiliaresDeRunInstances
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
          - arn:aws:ec2:*::image/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:subnet/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:security-group/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:key-pair/*
        # CreateTags sólo dentro de la creación (ec2:CreateAction).
        - Sid: EtiquetarSoloAlCrear
          Effect: Allow
          Action: ec2:CreateTags
          Resource: '*'
          Condition:
            StringEquals:
              ec2:CreateAction:
              - RunInstances
              - CreateVolume
              - CreateSecurityGroup
              - AllocateAddress
        # Arrancar/parar/reiniciar/terminar SÓLO lo que tiene la llave.
        - Sid: CicloDeVidaSoloDeLoDePCM
          Effect: Allow
          Action:
          - ec2:StartInstances
          - ec2:StopInstances
          - ec2:RebootInstances
          - ec2:TerminateInstances
          - ec2:ModifyInstanceAttribute
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
          Condition:
            StringEquals:
              aws:ResourceTag/primate:managed_by: pcm
        # Crear security groups sólo con la llave.
        - Sid: SecurityGroupPropioEtiquetado
          Effect: Allow
          Action: ec2:CreateSecurityGroup
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:security-group/*
          Condition:
            StringEquals:
              aws:RequestTag/primate:managed_by: pcm
        # (El SG nuevo se crea dentro de una VPC existente.)
        - Sid: SecurityGroupEnLaVpc
          Effect: Allow
          Action: ec2:CreateSecurityGroup
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:vpc/*
        # Abrir puertos sólo en SGs con la llave.
        - Sid: ReglasSoloEnElSecurityGroupDePCM
          Effect: Allow
          Action: ec2:AuthorizeSecurityGroupIngress
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:security-group/*
          Condition:
            StringEquals:
              aws:ResourceTag/primate:managed_by: pcm
        # Reservar Elastic IPs sólo con la llave.
        - Sid: ElasticIpPropia
          Effect: Allow
          Action:
          - ec2:AllocateAddress
          Resource: '*'
          Condition:
            StringEquals:
              aws:RequestTag/primate:managed_by: pcm
        # Asociar EIP sólo entre recursos con la llave.
        - Sid: AsociarEipSoloEntreRecursosDePCM
          Effect: Allow
          Action: ec2:AssociateAddress
          Resource:
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:elastic-ip/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
          Condition:
            StringEquals:
              aws:ResourceTag/primate:managed_by: pcm
        # Sólo puede pasarle a una EC2 el rol pcm-ssm-role.
        - Sid: PasarSoloElRolDeSSMDePCM
          Effect: Allow
          Action: iam:PassRole
          Resource:
            Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/pcm-ssm-role
          Condition:
            StringEquals:
              iam:PassedToService: ec2.amazonaws.com
        # El documento de shell para instalar Odoo (la instancia se limita abajo).
        - Sid: ShellDeInstalacionDocumento
          Effect: Allow
          Action: ssm:SendCommand
          Resource: arn:aws:ssm:*:*:document/AWS-RunShellScript
        # ...y sólo sobre instancias con la llave: nunca sobre un servidor ajeno.
        - Sid: ShellDeInstalacionSoloEnMaquinasDePCM
          Effect: Allow
          Action: ssm:SendCommand
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
          Condition:
            StringEquals:
              ssm:resourceTag/primate:managed_by: pcm
        # Buckets pcm-*: crear, listar, leer, borrar y lifecycle.
        - Sid: BucketsDeBackupDePCM
          Effect: Allow
          Action:
          - s3:CreateBucket
          - s3:ListBucket
          - s3:GetObject
          - s3:DeleteObject
          - s3:GetLifecycleConfiguration
          - s3:PutLifecycleConfiguration
          Resource:
          - arn:aws:s3:::pcm-*
          - arn:aws:s3:::pcm-*/*
        # Subir dumps SÓLO a incoming/ del bucket pcm-dumps-<cuenta>.
        - Sid: SubirDumpsSoloAlBucketDePCM
          Effect: Allow
          Action:
          - s3:PutObject
          - s3:AbortMultipartUpload
          Resource:
            Fn::Sub: arn:aws:s3:::pcm-dumps-${AWS::AccountId}/incoming/*
        # Deny: la llave primate:managed_by (cualquier mayúscula) sólo nace al crear.
        - Sid: NadieTocaLaLlaveDePropiedadEnRecursosExistentes
          Effect: Deny
          Action:
          - ec2:CreateTags
          - ec2:DeleteTags
          Resource: '*'
          Condition:
            ForAnyValue:StringEqualsIgnoreCase:
              aws:TagKeys:
              - primate:managed_by
            StringNotEquals:
              ec2:CreateAction:
              - RunInstances
              - CreateVolume
              - CreateSecurityGroup
              - AllocateAddress
        # Deny: ningún DeleteTags (uno sin claves borraría la llave sin nombrarla).
        - Sid: NuncaBorrarEtiquetas
          Effect: Deny
          Action: ec2:DeleteTags
          Resource: '*'

  # Usuario de PCM para leer. Sin consola (sin LoginProfile) y sin access
  # keys: las crea un humano en la consola y las carga en PCM.
  UsuarioReadonly:
    Type: AWS::IAM::User
    Properties:
      UserName: pcm-prod-ro
      ManagedPolicyArns:
      - Ref: PolicyReadonly

  # Usuario de PCM para montar. Ídem: sin consola y sin access keys.
  UsuarioProvision:
    Type: AWS::IAM::User
    Properties:
      UserName: pcm-prod-prov
      ManagedPolicyArns:
      - Ref: PolicyProvision
Outputs:
  Bucket:
    Value:
      Ref: BucketDumps
  DocumentoSSM:
    Value:
      Ref: DocumentoLecturaPCM
  PerfilDeInstancia:
    Value:
      Ref: PerfilSSM
  UsuarioReadonly:
    Value:
      Ref: UsuarioReadonly
  UsuarioProvision:
    Value:
      Ref: UsuarioProvision
