# =============================================================================
# pcm-prerequisitos.yaml — prerrequisitos de la cuenta AWS para PCM
# (Primate Cloud Manager, el módulo de Odoo con el que Primate gobierna sus
# servidores Odoo en AWS).
#
# QUÉ CREA (y nada más; no modifica ni importa ningún recurso existente):
#   1. Documento SSM «pcm-readonly-discovery»: el ÚNICO comando que PCM puede
#      correr en un servidor que NO montó PCM. Es un script fijo, sin
#      parámetros, de solo lectura (inventario de los Odoo del servidor).
#   2. Rol e instance profile «pcm-ssm-role»: el rol que llevan las EC2 que
#      SÍ monta PCM (agente SSM + subir/bajar dumps y backups en los buckets
#      pcm-<uso>-<cuenta> de ESTA cuenta). Limitación conocida: es UN rol
#      para todos los servidores de PCM, así que cualquiera de ellos puede
#      leer los dumps y backups de los demás (ver README_INCO.md).
#   3. Bucket «pcm-dumps-<cuenta>» (us-east-1): dumps a restaurar. Privado,
#      Block Public Access completo, cifrado SSE-S3, sin versionado, solo TLS;
#      lo de incoming/ se borra solo a los 7 días.
#   4. Managed policies «pcm-prod-readonly» y «pcm-prod-provision».
#   5. Usuarios IAM «pcm-prod-ro» y «pcm-prod-prov», cada uno con SOLO su
#      policy, sin acceso a la consola y SIN access keys (las crea un humano
#      después, en la consola, y las carga en PCM).
#
# EL MODELO DE SEGURIDAD, EN DOS IDEAS:
#   - La etiqueta «primate:managed_by = pcm» es la LLAVE: PCM sólo puede operar
#     recursos que la tengan, y la etiqueta sólo se puede poner EN EL MISMO
#     LLAMADO que crea el recurso. Nadie (ni estos usuarios) puede ponérsela o
#     sacársela a algo que ya existe: hay un Deny explícito.
#   - Dos usuarios separados a propósito. Juntos en uno, IAM evalúa SendCommand
#     por recurso (documento e instancia por separado) y la combinación de las
#     dos policies daría un shell arbitrario sobre un servidor ajeno.
#       pcm-prod-ro   → leer el inventario y correr SOLO el documento de lectura.
#       pcm-prod-prov → montar servidores NUEVOS (siempre con la llave) y
#                       operar sólo esos.
#
# CÓMO SE DESPLIEGA: CloudFormation → Create stack → Upload a template file →
# dejar «Sufijo» VACÍO (todo sale de los pseudo-parámetros de la cuenta) →
# «ZonaDns» y «NombresDns»: vacíos si PCM NO va a crear registros DNS (el
# dominio se agrega a mano en Route 53); completos (los dos) para que PCM cree
# SÓLO registros A con esos nombres en esa zona → tildar
# «I acknowledge … IAM resources with custom names» (CAPABILITY_NAMED_IAM).
# Solo en us-east-1 (regla «SoloEnUsEast1»). Para otras regiones con
# servidores a leer: pcm-ssm-readonly.yaml (sólo el documento SSM).
# Verificación posterior, de solo lectura: verificar.sh en CloudShell.
#
# Esta plantilla se GENERA (generar.py) desde las policies y el documento
# versionados del repo de PCM: no se edita a mano.
# =============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: 'PCM - prerrequisitos de la cuenta productiva: documento SSM de solo lectura, rol/instance
  profile pcm-ssm-role, bucket pcm-dumps-<cuenta>, policies pcm-prod-readonly / pcm-prod-provision y sus
  dos usuarios IAM (sin consola, sin access keys). Generada por infra/cloudformation/generar.py: no editar
  a mano.'
Parameters:
  Sufijo:
    Type: String
    Default: ''
    AllowedPattern: ^(-[a-z0-9]{1,12})?$
    Description: OPCIONAL. Vacío en producción. Se agrega al final de todos los nombres (p. ej. -cfn)
      para desplegar en una cuenta que ya tiene recursos con estos nombres, sin tocarlos.
  ZonaDns:
    Type: String
    Default: ''
    AllowedPattern: ^(Z[A-Z0-9]+)?$
    Description: 'OPCIONAL. Hosted Zone ID de Route 53 donde PCM puede crear los registros A de sus servidores
      (ej. Z0123456789ABC). Vacío = PCM no toca Route 53: el dominio se agrega a mano en la consola. Si
      se completa, NombresDns es obligatorio.'
  NombresDns:
    Type: String
    Default: ''
    AllowedPattern: ^([a-z0-9*][a-z0-9.*-]*(,[a-z0-9*][a-z0-9.*-]*)*)?$
    Description: OPCIONAL (obligatorio si hay ZonaDns). Nombres que PCM puede crear/actualizar/borrar
      en esa zona, en minúsculas, separados por coma, sin punto final; admite comodín (ej. *.erp.ejemplo.com).
      Sólo registros A.
Conditions:
  HayZonaDns:
    Fn::Not:
    - Fn::Equals:
      - Ref: ZonaDns
      - ''
Rules:
  NombresDnsSiHayZona:
    RuleCondition:
      Fn::Not:
      - Fn::Equals:
        - Ref: ZonaDns
        - ''
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: NombresDns
          - ''
      AssertDescription: 'Con ZonaDns hay que completar NombresDns: los nombres que PCM puede tocar en
        esa zona (sin ellos no se otorga nada).'
  ZonaDnsSiHayNombres:
    RuleCondition:
      Fn::Not:
      - Fn::Equals:
        - Ref: NombresDns
        - ''
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ZonaDns
          - ''
      AssertDescription: 'NombresDns sin ZonaDns no sirve: completá los dos o dejá los dos vacíos.'
  SoloEnUsEast1:
    Assertions:
    - Assert:
        Fn::Equals:
        - Ref: AWS::Region
        - us-east-1
      AssertDescription: 'Esta plantilla se despliega en us-east-1 (el bucket del dump va en la misma
        región que el servidor). Para otras regiones con servidores: pcm-ssm-readonly.yaml.'
Resources:

  # Documento SSM de SOLO LECTURA. El script va en runCommand, línea por
  # línea: primero el inventario (PCM_DISCOVERY_JSON) y después el gemelo
  # completo (PCM_TWIN_B64 + PCM_TWIN_OK). Sin parámetros: no hay forma de
  # pasarle un comando. UpdateMethod NewVersion: actualizar crea versión.
  DocumentoLecturaPCM:
    Type: AWS::SSM::Document
    Properties:
      Name:
        Fn::Sub: pcm-readonly-discovery${Sufijo}
      DocumentType: Command
      DocumentFormat: JSON
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: 'PCM: discovery de SOLO LECTURA (inventario + gemelo exacto, en tres pasos). Sin
          parámetros. No escribe nada en el servidor. Único SendCommand permitido por la policy pcm-prod-readonly.'
        parameters: {}
        mainSteps:
        - action: aws:runShellScript
          name: pcmInventario
          inputs:
            timeoutSeconds: '600'
            runCommand:
            - '#!/bin/bash'
            - set -uo pipefail
            - python3 - <<'PCM_F2_PY'
            - '#!/usr/bin/env python3'
            - '# -*- coding: utf-8 -*-'
            - '"""Discovery de instancias Odoo en un servidor importado.'
            - ''
            - =============================================================================
            - 'CONTRATO: SÓLO LECTURA. Este script corre por SSM, como root, en servidores'
            - 'ADOPTADOS: servidores productivos de clientes que PCM no creó. No escribe'
            - nada, no instala nada, no reinicia nada y no cambia ningún archivo, servicio,
            - base ni permiso.
            - ''
            - 'Todo lo que hace es LEER:'
            - '  - la lista de units de systemd  (systemctl list-units / show)'
            - '  - el odoo.conf de cada unit     (sólo las claves de la allowlist)'
            - '  - la versión de Odoo            (se lee release.py como texto, no se importa)'
            - '  - la lista de bases             (SELECT sobre pg_database)'
            - ''
            - Cualquier cambio que haga falta en uno de estos servidores tiene que pasar
            - primero por «Habilitar la gestión». Si alguna vez se agrega una línea que
            - escriba, este script deja de ser apto para servidores adoptados.
            - =============================================================================
            - ''
            - 'Las credenciales NO se leen: ``db_password`` y ``admin_passwd`` no están en la'
            - allowlist, así que se OMITEN (no se enmascaran). No se ejecuta el binario de
            - Odoo para saber la versión, porque eso correría código del cliente; se lee
            - '``odoo/release.py`` como texto.'
            - ''
            - 'Salida: una sola línea, ``PCM_DISCOVERY_B64:<base64(gzip(json))>`` (antes'
            - '``PCM_DISCOVERY_JSON:<json>``; PCM acepta las dos). Las listas van acotadas'
            - para no pasar el tope de 24.000 caracteres de ``get_command_invocation``.
            - '"""'
            - import base64
            - import gzip
            - import json
            - import os
            - import re
            - import subprocess
            - ''
            - MAX_UNITS = 30
            - MAX_DBS = 150
            - ''
            - '# Allowlist del odoo.conf: lo necesario para registrar la instancia. Sin'
            - '# db_password ni admin_passwd, a propósito.'
            - CONF_KEYS = ["data_dir", "db_user", "db_name", "db_host", "db_port",
            - '             "http_port", "xmlrpc_port", "addons_path", "dbfilter"]'
            - ''
            - ''
            - 'def correr(cmd, timeout=20):'
            - '    """Ejecuta un comando de LECTURA y devuelve (código, stdout)."""'
            - '    try:'
            - '        res = subprocess.run(cmd, capture_output=True, text=True,'
            - '                             timeout=timeout)'
            - '        return res.returncode, res.stdout'
            - '    except Exception as error:  # noqa: BLE001 - se informa, no se aborta'
            - '        return -1, str(error)'
            - ''
            - ''
            - 'def leer_conf(path):'
            - '    """Lee SÓLO las claves de la allowlist de un odoo.conf."""'
            - '    datos = {}'
            - '    try:'
            - '        with open(path, encoding="utf-8", errors="replace") as fh:'
            - '            for linea in fh:'
            - '                m = re.match(r"^\s*([a-z_]+)\s*=\s*(.*?)\s*$", linea)'
            - '                if m and m.group(1) in CONF_KEYS:'
            - '                    datos[m.group(1)] = m.group(2)'
            - '    except OSError as error:'
            - '        return None, str(error)'
            - '    return datos, None'
            - ''
            - ''
            - 'def version_odoo(exec_start):'
            - '    """Versión mayor de Odoo leyendo release.py como TEXTO (no se importa)."""'
            - '    for token in exec_start.split():'
            - '        if not re.search(r"(odoo-bin|openerp-server|odoo\.py)$", token):'
            - '            continue'
            - '        base = os.path.dirname(token.strip("\"''"))'
            - '        for rel in ("odoo/release.py", "openerp/release.py"):'
            - '            ruta = os.path.join(base, rel)'
            - '            try:'
            - '                with open(ruta, encoding="utf-8", errors="replace") as fh:'
            - '                    m = re.search(r"version_info\s*=\s*\(\s*(?:''saas~)?(\d+)",'
            - '                                  fh.read())'
            - '                if m:'
            - '                    return m.group(1)'
            - '            except OSError:'
            - '                continue'
            - '    return None'
            - ''
            - ''
            - 'def units_odoo():'
            - '    """Units de systemd cuyo nombre menciona odoo, con su conf y estado."""'
            - '    codigo, salida = correr(["systemctl", "list-units", "--type=service",'
            - '                             "--all", "--no-legend", "--plain"])'
            - '    if codigo != 0:'
            - '        return [], "systemctl no disponible: %s" % salida[:200]'
            - '    nombres = [ln.split()[0] for ln in salida.splitlines()'
            - '               if ln.strip() and re.search(r"odoo|openerp", ln.split()[0], re.I)]'
            - '    units = []'
            - '    for nombre in nombres[:MAX_UNITS]:'
            - '        _c, props = correr(["systemctl", "show", nombre, "-p", "ExecStart",'
            - '                            "-p", "ActiveState", "-p", "User"])'
            - '        info = dict(ln.split("=", 1) for ln in props.splitlines() if "=" in ln)'
            - '        exec_start = info.get("ExecStart", "")'
            - '        # ExecStart viene como "{ path=... ; argv[]=... ; ... }": el argv manda.'
            - '        argv = re.search(r"argv\[\]=([^;]*)", exec_start)'
            - '        linea = argv.group(1).strip() if argv else exec_start'
            - '        conf = re.search(r"(?:-c|--config)(?:=|\s+)(\S+)", linea)'
            - '        unit = {'
            - '            "unit": nombre,'
            - '            "active": info.get("ActiveState", ""),'
            - '            "user": info.get("User", ""),'
            - '            "exec": linea[:300],'
            - '            "conf_path": conf.group(1).strip("\"''") if conf else None,'
            - '            # El puerto puede venir por argumento y pisar el del conf.'
            - '            "port_arg": (lambda p: p.group(1) if p else None)(re.search('
            - '                r"--(?:http|xmlrpc)-port(?:=|\s+)(\d+)", linea)),'
            - '            "version": version_odoo(linea),'
            - '        }'
            - '        if unit["conf_path"]:'
            - '            datos, error = leer_conf(unit["conf_path"])'
            - '            unit["conf"] = datos'
            - '            unit["conf_error"] = error'
            - '        units.append(unit)'
            - '    return units, None'
            - ''
            - ''
            - 'def bases():'
            - '    """Bases no-template con su dueño (para asociarlas a su instancia)."""'
            - '    codigo, salida = correr(['
            - '        "sudo", "-u", "postgres", "psql", "-tAF|", "-c",'
            - '        "SELECT d.datname, pg_get_userbyid(d.datdba) FROM pg_database d "'
            - '        "WHERE NOT d.datistemplate AND d.datname <> ''postgres'' "'
            - '        "ORDER BY d.datname"])'
            - '    if codigo != 0:'
            - '        return [], "no se pudieron listar las bases: %s" % salida[:200]'
            - '    filas = []'
            - '    for ln in salida.splitlines()[:MAX_DBS]:'
            - '        if "|" in ln:'
            - '            nombre, dueno = ln.split("|", 1)'
            - '            filas.append({"name": nombre.strip(), "owner": dueno.strip()})'
            - '    return filas, None'
            - ''
            - ''
            - 'def main():'
            - '    units, error_units = units_odoo()'
            - '    dbs, error_dbs = bases()'
            - '    # Comprimida (gzip + base64): en el documento SSM el inventario es un'
            - '    # paso aparte con su tope de 24.000 caracteres, y así entra holgado.'
            - '    datos = json.dumps({'
            - '        "units": units, "units_error": error_units,'
            - '        "databases": dbs, "databases_error": error_dbs,'
            - '    }, separators=(",", ":"), ensure_ascii=False)'
            - '    print("PCM_DISCOVERY_B64:" + base64.b64encode('
            - '        gzip.compress(datos.encode())).decode())'
            - ''
            - ''
            - 'if __name__ == "__main__":'
            - '    main()'
            - PCM_F2_PY
        - action: aws:runShellScript
          name: pcmGemelo
          inputs:
            timeoutSeconds: '600'
            runCommand:
            - '#!/bin/bash'
            - export PCM_TWIN_MODO=gemelo
            - '# pcm_readonly_discovery.sh — Gemelo exacto.'
            - '#'
            - '# SOLO LECTURA por construcción: comandos fijos de consulta, SIN parámetros,'
            - '# sin escribir NADA en el servidor (la salida va por stdout, gzip+base64).'
            - '# Es el ÚNICO contenido del documento SSM pcm-readonly-discovery con el que'
            - '# la policy pcm-prod-readonly permite SendCommand: aunque la credencial se'
            - '# filtre, con ella no se puede ejecutar otra cosa en los servidores.'
            - '#'
            - '# Salida: líneas  PCM_TWIN_B64:<base64(gzip(json))>  + PCM_TWIN_OK con el'
            - '# gemelo: sistema, y por cada Odoo (conf de /etc/odoo/*.conf, /etc/odoo.conf'
            - '# Y los que usan las units systemd, sin duplicados): conf enmascarado,'
            - '# addons_path en orden, unit systemd, core/enterprise (versión+commit),'
            - '# python, repos git (remote, rama, SHA, submódulos, sucio/no pusheado), base'
            - '# (versión PG, tamaño, filestore), nginx (vhosts, dominios, certificados y'
            - '# vencimiento), crons del sistema con los secretos tapados. El pip freeze va'
            - '# UNA vez por venv (twin_format 2), no por instancia.'
            - '#'
            - '# Corre `du` sobre cada filestore y `pip freeze` por venv: en un servidor'
            - '# grande conviene correrlo fuera de horario.'
            - '#'
            - '# Por ssh, desde la máquina del operador (el script viaja por stdin, no se'
            - '# copia al servidor, y el gemelo vuelve por stdout):'
            - '#   ssh <host> ''sudo bash -s'' < pcm_readonly_discovery.sh > gemelo.txt'
            - set -uo pipefail
            - export LC_ALL=C
            - '# Lecturas que escriben como efecto lateral, apagadas: `git status` refresca'
            - '# .git/index (y toma index.lock) y Python deja .pyc al importar pip.'
            - export GIT_OPTIONAL_LOCKS=0 PYTHONDONTWRITEBYTECODE=1
            - export PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_CACHE_DIR=1
            - ''
            - python3 - <<'PCM_TWIN_PY'
            - import base64
            - import configparser
            - import glob
            - import gzip
            - import json
            - import os
            - import re
            - import subprocess
            - import sys
            - ''
            - ''
            - 'def sh(cmd, cwd=None, timeout=30):'
            - '    """Comando FIJO de consulta; cualquier fallo devuelve ''''."""'
            - '    try:'
            - '        out = subprocess.run('
            - '            cmd, shell=True, cwd=cwd, timeout=timeout,'
            - '            capture_output=True, text=True)'
            - '        return (out.stdout or "").strip()'
            - '    except Exception:'
            - '        return ""'
            - ''
            - ''
            - '# Claves del odoo.conf cuyo valor se tapa (subcadena, sin mayúsculas).'
            - MASCARA = ("password", "passwd", "secret", "token", "key", "api")
            - ''
            - '# Secretos en crontabs: VAR=valor con nombre sospechoso, --password[=| ]x,'
            - '# -p<pass> pegado (estilo mysql), y usuario:clave@ en URLs.'
            - _CRON_SECRETOS = [
            - '    (re.compile(r"(?i)\b([A-Z0-9_]*(?:PASS|PASSWD|PASSWORD|SECRET|TOKEN|KEY|API)"'
            - '                r"[A-Z0-9_]*\s*=\s*)(\"[^\"]*\"|''[^'']*''|\S+)"), r"\1******"),'
            - '    (re.compile(r"(?i)(--(?:password|passwd|pass|token|secret|api[-_]?key)"'
            - '                r"(?:=|\s+))(\S+)"), r"\1******"),'
            - '    (re.compile(r"(?<=\s)-p(?!\s)\S+"), "-p******"),'
            - '    (re.compile(r"(://[^/\s:@]+:)[^@\s/]+@"), r"\1******@"),'
            - ']'
            - ''
            - ''
            - 'def tapar_secretos(texto):'
            - '    """Crontab con los valores sensibles tapados (la forma queda visible)."""'
            - '    for patron, reemplazo in _CRON_SECRETOS:'
            - '        texto = patron.sub(reemplazo, texto or "")'
            - '    return texto'
            - ''
            - ''
            - 'def leer_conf(path):'
            - '    conf = configparser.ConfigParser(strict=False, interpolation=None)'
            - '    try:'
            - '        conf.read(path)'
            - '    except Exception:'
            - '        return {}, {}'
            - '    opts = dict(conf["options"]) if conf.has_section("options") else {}'
            - '    enmascarado = {'
            - '        k: ("******" if any(m in k.lower() for m in MASCARA)'
            - '            and v not in ("", "False") else v)'
            - '        for k, v in sorted(opts.items())}'
            - '    return opts, enmascarado'
            - ''
            - ''
            - 'def git_info(path):'
            - '    if not os.path.isdir(os.path.join(path, ".git")) and not os.path.isfile('
            - '            os.path.join(path, ".git")):'
            - '        return None'
            - '    info = {'
            - '        "path": path,'
            - '        "remote_url": sh("git -c safe.directory=''*'' config --get remote.origin.url",
              cwd=path),'
            - '        "branch": sh("git -c safe.directory=''*'' rev-parse --abbrev-ref HEAD", cwd=path),'
            - '        "commit_sha": sh("git -c safe.directory=''*'' rev-parse HEAD", cwd=path),'
            - '        "commit_date": sh("git -c safe.directory=''*'' log -1 --format=%cI", cwd=path),'
            - '        "submodules": [l.strip() for l in sh('
            - '            "git -c safe.directory=''*'' submodule status", cwd=path'
            - '        ).splitlines() if l.strip()],'
            - '    }'
            - '    porcelain = sh("git -c safe.directory=''*'' status --porcelain", cwd=path)'
            - '    info["dirty_files"] = len([l for l in porcelain.splitlines() if l.strip()])'
            - '    ahead = sh("git -c safe.directory=''*'' rev-list --count @{u}..HEAD", cwd=path)'
            - '    info["unpushed_commits"] = int(ahead) if ahead.isdigit() else None'
            - '    info["alert_local_changes"] = bool('
            - '        info["dirty_files"] or (info["unpushed_commits"] or 0) > 0)'
            - '    return info'
            - ''
            - ''
            - 'def version_odoo(src_dir):'
            - '    rel = os.path.join(src_dir, "odoo", "release.py")'
            - '    data = {"path": src_dir}'
            - '    if os.path.isfile(rel):'
            - '        txt = open(rel, encoding="utf-8", errors="replace").read()'
            - '        m = re.search(r"version_info\s*=\s*\(([^)]*)\)", txt)'
            - '        v = re.search(r"^version\s*=\s*[''\"]([^''\"]+)", txt, re.M)'
            - '        data["release"] = (v.group(1) if v else (m.group(1) if m else "?"))'
            - '    g = git_info(src_dir)'
            - '    if g:'
            - '        data.update({"commit_sha": g["commit_sha"], "branch": g["branch"]})'
            - '    return data'
            - ''
            - ''
            - 'def argv_de(execstart):'
            - '    """El comando real de un ExecStart de systemd: viene como'
            - '    «{ path=… ; argv[]=python odoo-bin -c x.conf ; … }»; si no trae argv[],'
            - '    es la línea tal cual."""'
            - '    m = re.search(r"argv\[\]=([^;]*)", execstart or "")'
            - '    return (m.group(1) if m else (execstart or "")).strip()'
            - ''
            - ''
            - 'def conf_de_argv(trozos):'
            - '    """El conf de un comando de Odoo: -c X, --config X o --config=X."""'
            - '    for i, t in enumerate(trozos):'
            - '        if t in ("-c", "--config") and i + 1 < len(trozos):'
            - '            return trozos[i + 1]'
            - '        if t.startswith("--config="):'
            - '            return t.split("=", 1)[1]'
            - '    return ""'
            - ''
            - ''
            - 'def units_odoo():'
            - '    """{conf_path real: datos de la unit} de las units systemd de Odoo.'
            - ''
            - '    Mismo criterio que el inventario (units cuyo nombre contiene «odoo»),'
            - '    y el conf sale del ExecStart: así entra un Odoo con el conf fuera de'
            - '    /etc/odoo. Se consulta UNA vez por servidor."""'
            - '    mapa = {}'
            - '    for unit in sh("systemctl list-units --type=service --all --no-legend "'
            - '                   "--plain ''*odoo*''").splitlines():'
            - '        name = unit.split()[0] if unit.split() else ""'
            - '        if not name:'
            - '            continue'
            - '        execstart = sh("systemctl show -p ExecStart --value %s" % name)'
            - '        trozos = argv_de(execstart).split()'
            - '        conf = conf_de_argv(trozos)'
            - '        if not conf:'
            - '            continue'
            - '        mapa[os.path.realpath(conf)] = {'
            - '            "unit": name,'
            - '            "python_bin": next((t for t in trozos if "python" in t), ""),'
            - '            "odoo_bin": next((t for t in trozos if "odoo-bin" in t'
            - '                              or t.endswith("odoo")), ""),'
            - '            "active": sh("systemctl is-active %s" % name),'
            - '            "enabled": sh("systemctl is-enabled %s" % name)}'
            - '    return mapa'
            - ''
            - ''
            - 'def empaquetar(obj):'
            - '    """JSON → gzip → base64 (una línea, sin espacios)."""'
            - '    return base64.b64encode(gzip.compress(json.dumps('
            - '        obj, ensure_ascii=False, separators=(",", ":")).encode())).decode()'
            - ''
            - ''
            - 'def trozos(prefijo, blob, largo=4000):'
            - '    """El blob en líneas de hasta `largo` caracteres con su prefijo."""'
            - '    return ["%s%s" % (prefijo, blob[i:i + largo])'
            - '            for i in range(0, len(blob), largo)] or [prefijo]'
            - ''
            - ''
            - 'def lineas_gemelo(twin):'
            - '    """Salida del paso «gemelo» del documento SSM (twin_format 3).'
            - ''
            - '    Primero la BASE (sistema, nginx, versiones de los venvs y cuántas'
            - '    instancias hay) y después UN REGISTRO POR INSTANCIA, cada uno cerrado'
            - '    con su marca, de la más chica a la más grande. Si la salida se corta en'
            - '    los 24.000 caracteres de SSM, se pierden sólo las instancias que no'
            - '    entraron (PCM las marca como faltantes), nunca el gemelo entero."""'
            - '    base = {k: v for k, v in twin.items() if k != "instances"}'
            - '    base["twin_format"] = 3'
            - '    base["n_instances"] = len(twin.get("instances") or [])'
            - '    salida = trozos("PCM_TWIN_BASE:", empaquetar(base)) + ["PCM_TWIN_BASE_OK"]'
            - '    registros = sorted('
            - '        (len(b), i, b) for i, b in'
            - '        ((i, empaquetar(inst)) for i, inst in enumerate(twin.get("instances") or [])))'
            - '    for _largo, i, blob in registros:'
            - '        salida += trozos("PCM_TWIN_INST:%d:" % i, blob)'
            - '        salida.append("PCM_TWIN_INST_OK:%d" % i)'
            - '    salida.append("PCM_TWIN_OK")'
            - '    return salida'
            - ''
            - ''
            - 'def lineas_venvs(venvs):'
            - '    """Salida del paso «venvs»: el pip freeze de cada venv, un registro por'
            - '    venv (de menor a mayor), con su propio tope de 24.000 caracteres."""'
            - '    registros = sorted('
            - '        (len(b), j, b) for j, b in'
            - '        ((j, empaquetar({"bin": py, "pip_freeze": datos.get("pip_freeze") or ""}))'
            - '         for j, (py, datos) in enumerate(sorted(venvs.items()))))'
            - '    salida = []'
            - '    for _largo, j, blob in registros:'
            - '        salida += trozos("PCM_TWIN_VENV:%d:" % j, blob)'
            - '        salida.append("PCM_TWIN_VENV_OK:%d" % j)'
            - '    salida.append("PCM_TWIN_VENVS_OK")'
            - '    return salida'
            - ''
            - ''
            - 'def confs_a_leer(units, base_dir="/etc"):'
            - '    """Unión, sin duplicados (por ruta real), de los conf de las ubicaciones'
            - '    de siempre (/etc/odoo/*.conf, /etc/odoo.conf) y los que usan las units'
            - '    systemd: un Odoo con el conf en /opt/x/odoo.conf no se pierde."""'
            - '    candidatos = sorted(glob.glob(os.path.join(base_dir, "odoo", "*.conf")))'
            - '    if os.path.isfile(os.path.join(base_dir, "odoo.conf")):'
            - '        candidatos.append(os.path.join(base_dir, "odoo.conf"))'
            - '    candidatos += sorted(units)'
            - '    confs, vistos = [], set()'
            - '    for c in candidatos:'
            - '        real = os.path.realpath(c)'
            - '        if real not in vistos and os.path.isfile(real):'
            - '            vistos.add(real)'
            - '            confs.append(c)'
            - '    return confs'
            - ''
            - ''
            - 'def es_enterprise(ruta):'
            - '    """Una ruta de addons es el enterprise de Odoo si trae web_enterprise'
            - '    (o se llama exactamente «enterprise»), no por contener la palabra."""'
            - '    return (os.path.isdir(os.path.join(ruta, "web_enterprise"))'
            - '            or os.path.basename(ruta) == "enterprise")'
            - ''
            - ''
            - 'def nginx_info():'
            - '    sitios = []'
            - '    for site in sorted(glob.glob("/etc/nginx/sites-enabled/*")):'
            - '        txt = ""'
            - '        try:'
            - '            txt = open(site, encoding="utf-8", errors="replace").read()'
            - '        except Exception:'
            - '            pass'
            - '        nombres = re.findall(r"server_name\s+([^;]+);", txt)'
            - '        certs = re.findall(r"ssl_certificate\s+([^;]+);", txt)'
            - '        upstreams = re.findall(r"proxy_pass\s+http://127\.0\.0\.1:(\d+)", txt)'
            - '        cert_info = []'
            - '        for cert in {c.strip() for c in certs}:'
            - '            end = sh("openssl x509 -enddate -noout -in %s" % cert)'
            - '            cert_info.append({"path": cert.strip(),'
            - '                              "not_after": end.replace("notAfter=", "")})'
            - '        sitios.append({"site": os.path.basename(site),'
            - '                       "server_names": " ".join(n.strip() for n in nombres),'
            - '                       "proxy_ports": sorted(set(upstreams)),'
            - '                       "certificates": cert_info})'
            - '    return sitios'
            - ''
            - ''
            - 'def db_info(opts):'
            - '    db = opts.get("db_name") or ""'
            - '    if not db or db in ("False",):'
            - '        return {}'
            - '    size = sh("sudo -u postgres psql -tAc "'
            - '              "\"SELECT pg_database_size(''%s'')\"" % db)'
            - '    return {'
            - '        "db_name": db,'
            - '        "pg_version": sh("sudo -u postgres psql -tAc ''SHOW server_version''"),'
            - '        "db_size_bytes": int(size) if size.isdigit() else None,'
            - '    }'
            - ''
            - ''
            - 'def filestore_info(opts):'
            - '    data_dir = opts.get("data_dir") or ""'
            - '    db = opts.get("db_name") or ""'
            - '    ruta = os.path.join(data_dir, "filestore", db) if data_dir and db else ""'
            - '    if not ruta or not os.path.isdir(ruta):'
            - '        return {"path": ruta or None}'
            - '    du = sh("du -sb %s" % ruta, timeout=120).split()'
            - '    return {"path": ruta,'
            - '            "size_bytes": int(du[0]) if du and du[0].isdigit() else None}'
            - ''
            - ''
            - '# PCM_TWIN_MODO: «todo» (default; por ssh, sin tope de salida: un solo blob'
            - '# formato 2), «gemelo» y «venvs» (los dos pasos del documento SSM, cada uno'
            - '# con su propio tope de 24.000 caracteres; ver lineas_gemelo/lineas_venvs).'
            - MODO = os.environ.get("PCM_TWIN_MODO", "todo")
            - UNITS = units_odoo()
            - CONFS = confs_a_leer(UNITS)
            - ''
            - 'if MODO == "venvs":'
            - '    # Sólo el pip freeze de cada venv: nada de git, du ni psql.'
            - '    venvs = {}'
            - '    for conf_path in CONFS:'
            - '        py = UNITS.get(os.path.realpath(conf_path), {}).get("python_bin") or ""'
            - '        if py and py not in venvs:'
            - '            venvs[py] = {"pip_freeze": sh("%s -m pip freeze 2>/dev/null" % py,'
            - '                                          timeout=120)}'
            - '    print("\n".join(lineas_venvs(venvs)))'
            - '    sys.exit(0)'
            - ''
            - twin = {
            - '    "twin_format": 2,'
            - '    "host": sh("hostname"),'
            - '    "system": {'
            - '        "os": sh(". /etc/os-release && echo $PRETTY_NAME"),'
            - '        "kernel": sh("uname -r"),'
            - '        "packages": {p: sh("dpkg-query -W -f=''${Version}'' %s 2>/dev/null" % p)'
            - '                     for p in ("nginx", "postgresql", "certbot",'
            - '                               "python3", "wkhtmltopdf")},'
            - '        "cron_system": tapar_secretos(sh("cat /etc/crontab 2>/dev/null")),'
            - '        "cron_d": sorted(os.path.basename(f)'
            - '                         for f in glob.glob("/etc/cron.d/*")),'
            - '        "cron_root": tapar_secretos(sh("crontab -l -u root 2>/dev/null")),'
            - '    },'
            - '    "instances": [],'
            - '    # Versión y pip freeze UNA vez por venv (python_bin): varias instancias'
            - '    # suelen compartirlo y es lo que más pesa en la salida.'
            - '    "venvs": {},'
            - '}'
            - ''
            - 'for conf_path in CONFS:'
            - '    opts, masked = leer_conf(conf_path)'
            - '    addons = [p for p in (opts.get("addons_path") or "").split(",") if p]'
            - '    unit = UNITS.get(os.path.realpath(conf_path), {})'
            - '    venv_python = unit.get("python_bin") or ""'
            - '    repos, core, enterprise = [], None, None'
            - '    for ruta in addons:'
            - '        ruta = ruta.strip().rstrip("/")'
            - '        base = ruta'
            - '        # El core suele entrar como <src>/addons y <src>/odoo/addons.'
            - '        if base.endswith("/addons"):'
            - '            padre = os.path.dirname(base)'
            - '            if os.path.isfile(os.path.join(padre, "odoo-bin")):'
            - '                core = core or version_odoo(padre)'
            - '                continue'
            - '            abuelo = os.path.dirname(padre)'
            - '            if padre.endswith("/odoo") and os.path.isfile('
            - '                    os.path.join(abuelo, "odoo-bin")):'
            - '                core = core or version_odoo(abuelo)'
            - '                continue'
            - '        # Una sola ruta es «enterprise»; cualquier otra (aunque su nombre'
            - '        # contenga la palabra) es un repo más.'
            - '        if enterprise is None and es_enterprise(base):'
            - '            g = git_info(base)'
            - '            if g:'
            - '                enterprise = g'
            - '                continue'
            - '        g = git_info(base)'
            - '        if g:'
            - '            repos.append(g)'
            - '        else:'
            - '            repos.append({"path": base, "remote_url": None,'
            - '                          "alert_local_changes": False,'
            - '                          "note": "sin git (carpeta suelta)"})'
            - '    if venv_python and venv_python not in twin["venvs"]:'
            - '        twin["venvs"][venv_python] = {'
            - '            "version": sh("%s --version" % venv_python)}'
            - '        if MODO == "todo":'
            - '            twin["venvs"][venv_python]["pip_freeze"] = sh('
            - '                "%s -m pip freeze 2>/dev/null" % venv_python, timeout=120)'
            - '    twin["instances"].append({'
            - '        "conf_path": conf_path,'
            - '        "conf_masked": masked,'
            - '        "addons_path": addons,'
            - '        "workers": opts.get("workers"),'
            - '        "limits": {k: v for k, v in opts.items() if k.startswith("limit_")},'
            - '        "service": unit,'
            - '        "odoo_core": core,'
            - '        "odoo_enterprise": enterprise,'
            - '        "python": {"bin": venv_python},'
            - '        "database": db_info(opts),'
            - '        "filestore": filestore_info(opts),'
            - '        "repos": repos,'
            - '    })'
            - ''
            - twin["nginx"] = nginx_info()
            - 'if MODO == "gemelo":'
            - '    print("\n".join(lineas_gemelo(twin)))'
            - 'else:'
            - '    # Por ssh no hay tope: un solo blob (formato 2), en trozos de 4000.'
            - '    print("\n".join(trozos("PCM_TWIN_B64:", empaquetar(twin))))'
            - '    print("PCM_TWIN_OK")'
            - PCM_TWIN_PY
        - action: aws:runShellScript
          name: pcmGemeloVenvs
          inputs:
            timeoutSeconds: '600'
            runCommand:
            - '#!/bin/bash'
            - export PCM_TWIN_MODO=venvs
            - '# pcm_readonly_discovery.sh — Gemelo exacto.'
            - '#'
            - '# SOLO LECTURA por construcción: comandos fijos de consulta, SIN parámetros,'
            - '# sin escribir NADA en el servidor (la salida va por stdout, gzip+base64).'
            - '# Es el ÚNICO contenido del documento SSM pcm-readonly-discovery con el que'
            - '# la policy pcm-prod-readonly permite SendCommand: aunque la credencial se'
            - '# filtre, con ella no se puede ejecutar otra cosa en los servidores.'
            - '#'
            - '# Salida: líneas  PCM_TWIN_B64:<base64(gzip(json))>  + PCM_TWIN_OK con el'
            - '# gemelo: sistema, y por cada Odoo (conf de /etc/odoo/*.conf, /etc/odoo.conf'
            - '# Y los que usan las units systemd, sin duplicados): conf enmascarado,'
            - '# addons_path en orden, unit systemd, core/enterprise (versión+commit),'
            - '# python, repos git (remote, rama, SHA, submódulos, sucio/no pusheado), base'
            - '# (versión PG, tamaño, filestore), nginx (vhosts, dominios, certificados y'
            - '# vencimiento), crons del sistema con los secretos tapados. El pip freeze va'
            - '# UNA vez por venv (twin_format 2), no por instancia.'
            - '#'
            - '# Corre `du` sobre cada filestore y `pip freeze` por venv: en un servidor'
            - '# grande conviene correrlo fuera de horario.'
            - '#'
            - '# Por ssh, desde la máquina del operador (el script viaja por stdin, no se'
            - '# copia al servidor, y el gemelo vuelve por stdout):'
            - '#   ssh <host> ''sudo bash -s'' < pcm_readonly_discovery.sh > gemelo.txt'
            - set -uo pipefail
            - export LC_ALL=C
            - '# Lecturas que escriben como efecto lateral, apagadas: `git status` refresca'
            - '# .git/index (y toma index.lock) y Python deja .pyc al importar pip.'
            - export GIT_OPTIONAL_LOCKS=0 PYTHONDONTWRITEBYTECODE=1
            - export PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_CACHE_DIR=1
            - ''
            - python3 - <<'PCM_TWIN_PY'
            - import base64
            - import configparser
            - import glob
            - import gzip
            - import json
            - import os
            - import re
            - import subprocess
            - import sys
            - ''
            - ''
            - 'def sh(cmd, cwd=None, timeout=30):'
            - '    """Comando FIJO de consulta; cualquier fallo devuelve ''''."""'
            - '    try:'
            - '        out = subprocess.run('
            - '            cmd, shell=True, cwd=cwd, timeout=timeout,'
            - '            capture_output=True, text=True)'
            - '        return (out.stdout or "").strip()'
            - '    except Exception:'
            - '        return ""'
            - ''
            - ''
            - '# Claves del odoo.conf cuyo valor se tapa (subcadena, sin mayúsculas).'
            - MASCARA = ("password", "passwd", "secret", "token", "key", "api")
            - ''
            - '# Secretos en crontabs: VAR=valor con nombre sospechoso, --password[=| ]x,'
            - '# -p<pass> pegado (estilo mysql), y usuario:clave@ en URLs.'
            - _CRON_SECRETOS = [
            - '    (re.compile(r"(?i)\b([A-Z0-9_]*(?:PASS|PASSWD|PASSWORD|SECRET|TOKEN|KEY|API)"'
            - '                r"[A-Z0-9_]*\s*=\s*)(\"[^\"]*\"|''[^'']*''|\S+)"), r"\1******"),'
            - '    (re.compile(r"(?i)(--(?:password|passwd|pass|token|secret|api[-_]?key)"'
            - '                r"(?:=|\s+))(\S+)"), r"\1******"),'
            - '    (re.compile(r"(?<=\s)-p(?!\s)\S+"), "-p******"),'
            - '    (re.compile(r"(://[^/\s:@]+:)[^@\s/]+@"), r"\1******@"),'
            - ']'
            - ''
            - ''
            - 'def tapar_secretos(texto):'
            - '    """Crontab con los valores sensibles tapados (la forma queda visible)."""'
            - '    for patron, reemplazo in _CRON_SECRETOS:'
            - '        texto = patron.sub(reemplazo, texto or "")'
            - '    return texto'
            - ''
            - ''
            - 'def leer_conf(path):'
            - '    conf = configparser.ConfigParser(strict=False, interpolation=None)'
            - '    try:'
            - '        conf.read(path)'
            - '    except Exception:'
            - '        return {}, {}'
            - '    opts = dict(conf["options"]) if conf.has_section("options") else {}'
            - '    enmascarado = {'
            - '        k: ("******" if any(m in k.lower() for m in MASCARA)'
            - '            and v not in ("", "False") else v)'
            - '        for k, v in sorted(opts.items())}'
            - '    return opts, enmascarado'
            - ''
            - ''
            - 'def git_info(path):'
            - '    if not os.path.isdir(os.path.join(path, ".git")) and not os.path.isfile('
            - '            os.path.join(path, ".git")):'
            - '        return None'
            - '    info = {'
            - '        "path": path,'
            - '        "remote_url": sh("git -c safe.directory=''*'' config --get remote.origin.url",
              cwd=path),'
            - '        "branch": sh("git -c safe.directory=''*'' rev-parse --abbrev-ref HEAD", cwd=path),'
            - '        "commit_sha": sh("git -c safe.directory=''*'' rev-parse HEAD", cwd=path),'
            - '        "commit_date": sh("git -c safe.directory=''*'' log -1 --format=%cI", cwd=path),'
            - '        "submodules": [l.strip() for l in sh('
            - '            "git -c safe.directory=''*'' submodule status", cwd=path'
            - '        ).splitlines() if l.strip()],'
            - '    }'
            - '    porcelain = sh("git -c safe.directory=''*'' status --porcelain", cwd=path)'
            - '    info["dirty_files"] = len([l for l in porcelain.splitlines() if l.strip()])'
            - '    ahead = sh("git -c safe.directory=''*'' rev-list --count @{u}..HEAD", cwd=path)'
            - '    info["unpushed_commits"] = int(ahead) if ahead.isdigit() else None'
            - '    info["alert_local_changes"] = bool('
            - '        info["dirty_files"] or (info["unpushed_commits"] or 0) > 0)'
            - '    return info'
            - ''
            - ''
            - 'def version_odoo(src_dir):'
            - '    rel = os.path.join(src_dir, "odoo", "release.py")'
            - '    data = {"path": src_dir}'
            - '    if os.path.isfile(rel):'
            - '        txt = open(rel, encoding="utf-8", errors="replace").read()'
            - '        m = re.search(r"version_info\s*=\s*\(([^)]*)\)", txt)'
            - '        v = re.search(r"^version\s*=\s*[''\"]([^''\"]+)", txt, re.M)'
            - '        data["release"] = (v.group(1) if v else (m.group(1) if m else "?"))'
            - '    g = git_info(src_dir)'
            - '    if g:'
            - '        data.update({"commit_sha": g["commit_sha"], "branch": g["branch"]})'
            - '    return data'
            - ''
            - ''
            - 'def argv_de(execstart):'
            - '    """El comando real de un ExecStart de systemd: viene como'
            - '    «{ path=… ; argv[]=python odoo-bin -c x.conf ; … }»; si no trae argv[],'
            - '    es la línea tal cual."""'
            - '    m = re.search(r"argv\[\]=([^;]*)", execstart or "")'
            - '    return (m.group(1) if m else (execstart or "")).strip()'
            - ''
            - ''
            - 'def conf_de_argv(trozos):'
            - '    """El conf de un comando de Odoo: -c X, --config X o --config=X."""'
            - '    for i, t in enumerate(trozos):'
            - '        if t in ("-c", "--config") and i + 1 < len(trozos):'
            - '            return trozos[i + 1]'
            - '        if t.startswith("--config="):'
            - '            return t.split("=", 1)[1]'
            - '    return ""'
            - ''
            - ''
            - 'def units_odoo():'
            - '    """{conf_path real: datos de la unit} de las units systemd de Odoo.'
            - ''
            - '    Mismo criterio que el inventario (units cuyo nombre contiene «odoo»),'
            - '    y el conf sale del ExecStart: así entra un Odoo con el conf fuera de'
            - '    /etc/odoo. Se consulta UNA vez por servidor."""'
            - '    mapa = {}'
            - '    for unit in sh("systemctl list-units --type=service --all --no-legend "'
            - '                   "--plain ''*odoo*''").splitlines():'
            - '        name = unit.split()[0] if unit.split() else ""'
            - '        if not name:'
            - '            continue'
            - '        execstart = sh("systemctl show -p ExecStart --value %s" % name)'
            - '        trozos = argv_de(execstart).split()'
            - '        conf = conf_de_argv(trozos)'
            - '        if not conf:'
            - '            continue'
            - '        mapa[os.path.realpath(conf)] = {'
            - '            "unit": name,'
            - '            "python_bin": next((t for t in trozos if "python" in t), ""),'
            - '            "odoo_bin": next((t for t in trozos if "odoo-bin" in t'
            - '                              or t.endswith("odoo")), ""),'
            - '            "active": sh("systemctl is-active %s" % name),'
            - '            "enabled": sh("systemctl is-enabled %s" % name)}'
            - '    return mapa'
            - ''
            - ''
            - 'def empaquetar(obj):'
            - '    """JSON → gzip → base64 (una línea, sin espacios)."""'
            - '    return base64.b64encode(gzip.compress(json.dumps('
            - '        obj, ensure_ascii=False, separators=(",", ":")).encode())).decode()'
            - ''
            - ''
            - 'def trozos(prefijo, blob, largo=4000):'
            - '    """El blob en líneas de hasta `largo` caracteres con su prefijo."""'
            - '    return ["%s%s" % (prefijo, blob[i:i + largo])'
            - '            for i in range(0, len(blob), largo)] or [prefijo]'
            - ''
            - ''
            - 'def lineas_gemelo(twin):'
            - '    """Salida del paso «gemelo» del documento SSM (twin_format 3).'
            - ''
            - '    Primero la BASE (sistema, nginx, versiones de los venvs y cuántas'
            - '    instancias hay) y después UN REGISTRO POR INSTANCIA, cada uno cerrado'
            - '    con su marca, de la más chica a la más grande. Si la salida se corta en'
            - '    los 24.000 caracteres de SSM, se pierden sólo las instancias que no'
            - '    entraron (PCM las marca como faltantes), nunca el gemelo entero."""'
            - '    base = {k: v for k, v in twin.items() if k != "instances"}'
            - '    base["twin_format"] = 3'
            - '    base["n_instances"] = len(twin.get("instances") or [])'
            - '    salida = trozos("PCM_TWIN_BASE:", empaquetar(base)) + ["PCM_TWIN_BASE_OK"]'
            - '    registros = sorted('
            - '        (len(b), i, b) for i, b in'
            - '        ((i, empaquetar(inst)) for i, inst in enumerate(twin.get("instances") or [])))'
            - '    for _largo, i, blob in registros:'
            - '        salida += trozos("PCM_TWIN_INST:%d:" % i, blob)'
            - '        salida.append("PCM_TWIN_INST_OK:%d" % i)'
            - '    salida.append("PCM_TWIN_OK")'
            - '    return salida'
            - ''
            - ''
            - 'def lineas_venvs(venvs):'
            - '    """Salida del paso «venvs»: el pip freeze de cada venv, un registro por'
            - '    venv (de menor a mayor), con su propio tope de 24.000 caracteres."""'
            - '    registros = sorted('
            - '        (len(b), j, b) for j, b in'
            - '        ((j, empaquetar({"bin": py, "pip_freeze": datos.get("pip_freeze") or ""}))'
            - '         for j, (py, datos) in enumerate(sorted(venvs.items()))))'
            - '    salida = []'
            - '    for _largo, j, blob in registros:'
            - '        salida += trozos("PCM_TWIN_VENV:%d:" % j, blob)'
            - '        salida.append("PCM_TWIN_VENV_OK:%d" % j)'
            - '    salida.append("PCM_TWIN_VENVS_OK")'
            - '    return salida'
            - ''
            - ''
            - 'def confs_a_leer(units, base_dir="/etc"):'
            - '    """Unión, sin duplicados (por ruta real), de los conf de las ubicaciones'
            - '    de siempre (/etc/odoo/*.conf, /etc/odoo.conf) y los que usan las units'
            - '    systemd: un Odoo con el conf en /opt/x/odoo.conf no se pierde."""'
            - '    candidatos = sorted(glob.glob(os.path.join(base_dir, "odoo", "*.conf")))'
            - '    if os.path.isfile(os.path.join(base_dir, "odoo.conf")):'
            - '        candidatos.append(os.path.join(base_dir, "odoo.conf"))'
            - '    candidatos += sorted(units)'
            - '    confs, vistos = [], set()'
            - '    for c in candidatos:'
            - '        real = os.path.realpath(c)'
            - '        if real not in vistos and os.path.isfile(real):'
            - '            vistos.add(real)'
            - '            confs.append(c)'
            - '    return confs'
            - ''
            - ''
            - 'def es_enterprise(ruta):'
            - '    """Una ruta de addons es el enterprise de Odoo si trae web_enterprise'
            - '    (o se llama exactamente «enterprise»), no por contener la palabra."""'
            - '    return (os.path.isdir(os.path.join(ruta, "web_enterprise"))'
            - '            or os.path.basename(ruta) == "enterprise")'
            - ''
            - ''
            - 'def nginx_info():'
            - '    sitios = []'
            - '    for site in sorted(glob.glob("/etc/nginx/sites-enabled/*")):'
            - '        txt = ""'
            - '        try:'
            - '            txt = open(site, encoding="utf-8", errors="replace").read()'
            - '        except Exception:'
            - '            pass'
            - '        nombres = re.findall(r"server_name\s+([^;]+);", txt)'
            - '        certs = re.findall(r"ssl_certificate\s+([^;]+);", txt)'
            - '        upstreams = re.findall(r"proxy_pass\s+http://127\.0\.0\.1:(\d+)", txt)'
            - '        cert_info = []'
            - '        for cert in {c.strip() for c in certs}:'
            - '            end = sh("openssl x509 -enddate -noout -in %s" % cert)'
            - '            cert_info.append({"path": cert.strip(),'
            - '                              "not_after": end.replace("notAfter=", "")})'
            - '        sitios.append({"site": os.path.basename(site),'
            - '                       "server_names": " ".join(n.strip() for n in nombres),'
            - '                       "proxy_ports": sorted(set(upstreams)),'
            - '                       "certificates": cert_info})'
            - '    return sitios'
            - ''
            - ''
            - 'def db_info(opts):'
            - '    db = opts.get("db_name") or ""'
            - '    if not db or db in ("False",):'
            - '        return {}'
            - '    size = sh("sudo -u postgres psql -tAc "'
            - '              "\"SELECT pg_database_size(''%s'')\"" % db)'
            - '    return {'
            - '        "db_name": db,'
            - '        "pg_version": sh("sudo -u postgres psql -tAc ''SHOW server_version''"),'
            - '        "db_size_bytes": int(size) if size.isdigit() else None,'
            - '    }'
            - ''
            - ''
            - 'def filestore_info(opts):'
            - '    data_dir = opts.get("data_dir") or ""'
            - '    db = opts.get("db_name") or ""'
            - '    ruta = os.path.join(data_dir, "filestore", db) if data_dir and db else ""'
            - '    if not ruta or not os.path.isdir(ruta):'
            - '        return {"path": ruta or None}'
            - '    du = sh("du -sb %s" % ruta, timeout=120).split()'
            - '    return {"path": ruta,'
            - '            "size_bytes": int(du[0]) if du and du[0].isdigit() else None}'
            - ''
            - ''
            - '# PCM_TWIN_MODO: «todo» (default; por ssh, sin tope de salida: un solo blob'
            - '# formato 2), «gemelo» y «venvs» (los dos pasos del documento SSM, cada uno'
            - '# con su propio tope de 24.000 caracteres; ver lineas_gemelo/lineas_venvs).'
            - MODO = os.environ.get("PCM_TWIN_MODO", "todo")
            - UNITS = units_odoo()
            - CONFS = confs_a_leer(UNITS)
            - ''
            - 'if MODO == "venvs":'
            - '    # Sólo el pip freeze de cada venv: nada de git, du ni psql.'
            - '    venvs = {}'
            - '    for conf_path in CONFS:'
            - '        py = UNITS.get(os.path.realpath(conf_path), {}).get("python_bin") or ""'
            - '        if py and py not in venvs:'
            - '            venvs[py] = {"pip_freeze": sh("%s -m pip freeze 2>/dev/null" % py,'
            - '                                          timeout=120)}'
            - '    print("\n".join(lineas_venvs(venvs)))'
            - '    sys.exit(0)'
            - ''
            - twin = {
            - '    "twin_format": 2,'
            - '    "host": sh("hostname"),'
            - '    "system": {'
            - '        "os": sh(". /etc/os-release && echo $PRETTY_NAME"),'
            - '        "kernel": sh("uname -r"),'
            - '        "packages": {p: sh("dpkg-query -W -f=''${Version}'' %s 2>/dev/null" % p)'
            - '                     for p in ("nginx", "postgresql", "certbot",'
            - '                               "python3", "wkhtmltopdf")},'
            - '        "cron_system": tapar_secretos(sh("cat /etc/crontab 2>/dev/null")),'
            - '        "cron_d": sorted(os.path.basename(f)'
            - '                         for f in glob.glob("/etc/cron.d/*")),'
            - '        "cron_root": tapar_secretos(sh("crontab -l -u root 2>/dev/null")),'
            - '    },'
            - '    "instances": [],'
            - '    # Versión y pip freeze UNA vez por venv (python_bin): varias instancias'
            - '    # suelen compartirlo y es lo que más pesa en la salida.'
            - '    "venvs": {},'
            - '}'
            - ''
            - 'for conf_path in CONFS:'
            - '    opts, masked = leer_conf(conf_path)'
            - '    addons = [p for p in (opts.get("addons_path") or "").split(",") if p]'
            - '    unit = UNITS.get(os.path.realpath(conf_path), {})'
            - '    venv_python = unit.get("python_bin") or ""'
            - '    repos, core, enterprise = [], None, None'
            - '    for ruta in addons:'
            - '        ruta = ruta.strip().rstrip("/")'
            - '        base = ruta'
            - '        # El core suele entrar como <src>/addons y <src>/odoo/addons.'
            - '        if base.endswith("/addons"):'
            - '            padre = os.path.dirname(base)'
            - '            if os.path.isfile(os.path.join(padre, "odoo-bin")):'
            - '                core = core or version_odoo(padre)'
            - '                continue'
            - '            abuelo = os.path.dirname(padre)'
            - '            if padre.endswith("/odoo") and os.path.isfile('
            - '                    os.path.join(abuelo, "odoo-bin")):'
            - '                core = core or version_odoo(abuelo)'
            - '                continue'
            - '        # Una sola ruta es «enterprise»; cualquier otra (aunque su nombre'
            - '        # contenga la palabra) es un repo más.'
            - '        if enterprise is None and es_enterprise(base):'
            - '            g = git_info(base)'
            - '            if g:'
            - '                enterprise = g'
            - '                continue'
            - '        g = git_info(base)'
            - '        if g:'
            - '            repos.append(g)'
            - '        else:'
            - '            repos.append({"path": base, "remote_url": None,'
            - '                          "alert_local_changes": False,'
            - '                          "note": "sin git (carpeta suelta)"})'
            - '    if venv_python and venv_python not in twin["venvs"]:'
            - '        twin["venvs"][venv_python] = {'
            - '            "version": sh("%s --version" % venv_python)}'
            - '        if MODO == "todo":'
            - '            twin["venvs"][venv_python]["pip_freeze"] = sh('
            - '                "%s -m pip freeze 2>/dev/null" % venv_python, timeout=120)'
            - '    twin["instances"].append({'
            - '        "conf_path": conf_path,'
            - '        "conf_masked": masked,'
            - '        "addons_path": addons,'
            - '        "workers": opts.get("workers"),'
            - '        "limits": {k: v for k, v in opts.items() if k.startswith("limit_")},'
            - '        "service": unit,'
            - '        "odoo_core": core,'
            - '        "odoo_enterprise": enterprise,'
            - '        "python": {"bin": venv_python},'
            - '        "database": db_info(opts),'
            - '        "filestore": filestore_info(opts),'
            - '        "repos": repos,'
            - '    })'
            - ''
            - twin["nginx"] = nginx_info()
            - 'if MODO == "gemelo":'
            - '    print("\n".join(lineas_gemelo(twin)))'
            - 'else:'
            - '    # Por ssh no hay tope: un solo blob (formato 2), en trozos de 4000.'
            - '    print("\n".join(trozos("PCM_TWIN_B64:", empaquetar(twin))))'
            - '    print("PCM_TWIN_OK")'
            - PCM_TWIN_PY

  # Rol de las EC2 que monta PCM. AmazonSSMManagedInstanceCore habilita el
  # agente SSM (PCM nunca usa SSH); la inline permite subir/bajar dumps y
  # backups SÓLO en los buckets pcm-<uso>-<cuenta> de esta cuenta
  # (aws:ResourceAccount). No lo usan los servidores importados.
  # LIMITACIÓN: un solo rol para todos los servidores de PCM.
  RolSSM:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: pcm-ssm-role${Sufijo}
      Description: 'PCM: rol de las EC2 que monta PCM (agente SSM + subir/bajar dumps en buckets pcm-*).'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
      - PolicyName: PcmS3BackupObjects
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: ObjetosDeLosBucketsDePCMDeEstaCuenta
            Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::pcm-*-${AWS::AccountId}${Sufijo}/*
            Condition:
              StringEquals:
                aws:ResourceAccount:
                  Ref: AWS::AccountId

  # Instance profile con el mismo nombre del rol (es lo que se le pasa a
  # RunInstances; pcm-prod-prov sólo puede pasar este rol).
  PerfilSSM:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName:
        Fn::Sub: pcm-ssm-role${Sufijo}
      Roles:
      - Ref: RolSSM

  # Bucket de dumps a restaurar. Retain: borrar el stack NO borra el bucket.
  # Sin VersioningConfiguration = sin versionado (lo que PCM borra al
  # terminar un restore se borra de verdad). incoming/ expira a los 7 días
  # y los multipart incompletos a 1 día.
  BucketDumps:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: pcm-dumps-${AWS::AccountId}${Sufijo}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: incoming-7-dias
          Status: Enabled
          Prefix: incoming/
          ExpirationInDays: 7
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1

  # Rechaza cualquier acceso al bucket que no venga por TLS.
  BucketDumpsSoloTLS:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: BucketDumps
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: SoloConTLS
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::pcm-dumps-${AWS::AccountId}${Sufijo}
          - Fn::Sub: arn:${AWS::Partition}:s3:::pcm-dumps-${AWS::AccountId}${Sufijo}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'

  # pcm-prod-readonly: leer el inventario (EC2, RDS, Route 53, CloudWatch,
  # costos) y correr SÓLO el documento de lectura. Los Deny explícitos son
  # una segunda red: aunque alguien le sumara otra policy a este usuario,
  # lo que no es de PCM sigue intocable.
  PolicyReadonly:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: pcm-prod-readonly${Sufijo}
      Description: 'PCM: inventario, importacion y gemelo de SOLO LECTURA.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        # Lecturas del inventario (Describe/List/Get). Nada escribe.
        - Sid: LecturaInventario
          Effect: Allow
          Action:
          - sts:GetCallerIdentity
          - ec2:DescribeInstances
          - ec2:DescribeInstanceStatus
          - ec2:DescribeRegions
          - ec2:DescribeAvailabilityZones
          - ec2:DescribeVpcs
          - ec2:DescribeSubnets
          - ec2:DescribeSecurityGroups
          - ec2:DescribeImages
          - ec2:DescribeVolumes
          - ec2:DescribeAddresses
          - ec2:DescribeTags
          - ec2:DescribeInstanceTypes
          - ec2:DescribeKeyPairs
          - rds:DescribeDBInstances
          - rds:DescribeDBSnapshots
          - rds:ListTagsForResource
          - route53:ListHostedZones
          - route53:GetHostedZone
          - route53:ListResourceRecordSets
          - route53:GetChange
          - cloudwatch:GetMetricData
          - cloudwatch:GetMetricStatistics
          - cloudwatch:ListMetrics
          - ce:GetCostAndUsage
          - ce:GetCostForecast
          - ssm:DescribeInstanceInformation
          - ssm:GetCommandInvocation
          - ssm:ListCommands
          - ssm:ListCommandInvocations
          - ssm:DescribeDocument
          - ssm:GetDocument
          Resource: '*'
        # SendCommand SÓLO con el documento propio; ningún otro documento está permitido.
        - Sid: DiscoverySoloConElDocumentoPropio
          Effect: Allow
          Action: ssm:SendCommand
          Resource:
          - Fn::Sub: arn:aws:ssm:*:${AWS::AccountId}:document/pcm-readonly-discovery${Sufijo}
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
        # Deny: ninguna acción de ciclo de vida, red ni discos sobre lo que no tiene la llave.
        - Sid: MaquinasNoCreadasPorPCMIntocables
          Effect: Deny
          Action:
          - ec2:StartInstances
          - ec2:StopInstances
          - ec2:RebootInstances
          - ec2:TerminateInstances
          - ec2:ModifyInstanceAttribute
          - ec2:ModifyInstanceMetadataOptions
          - ec2:AssociateIamInstanceProfile
          - ec2:ReplaceIamInstanceProfileAssociation
          - ec2:AttachVolume
          - ec2:DetachVolume
          - ec2:DeleteVolume
          - ec2:ModifyVolume
          - ec2:CreateSnapshot
          - ec2:AssociateAddress
          - ec2:DisassociateAddress
          - ec2:ReleaseAddress
          - ec2:AuthorizeSecurityGroupIngress
          - ec2:AuthorizeSecurityGroupEgress
          - ec2:RevokeSecurityGroupIngress
          - ec2:RevokeSecurityGroupEgress
          - ec2:DeleteSecurityGroup
          - ec2:DeleteTags
          Resource: '*'
          Condition:
            StringNotEquals:
              aws:ResourceTag/primate:managed_by: pcm
        # Deny: no etiquetar recursos ajenos (salvo dentro de una creación).
        - Sid: EtiquetasDeLoAjenoIntocables
          Effect: Deny
          Action: ec2:CreateTags
          Resource: '*'
          Condition:
            StringNotEquals:
              aws:ResourceTag/primate:managed_by: pcm
              ec2:CreateAction:
              - RunInstances
              - CreateVolume
              - CreateSecurityGroup
              - AllocateAddress
        # Deny: las RDS ajenas no se tocan.
        - Sid: BasesRdsNoCreadasPorPCMIntocables
          Effect: Deny
          Action:
          - rds:ModifyDBInstance
          - rds:DeleteDBInstance
          - rds:RebootDBInstance
          - rds:StopDBInstance
          - rds:StartDBInstance
          - rds:RestoreDBInstanceFromDBSnapshot
          - rds:AddTagsToResource
          - rds:RemoveTagsFromResource
          Resource: '*'
          Condition:
            StringNotEquals:
              rds:db-tag/primate:managed_by: pcm
        # Deny: sin sesiones, automatizaciones, documentos, parámetros, zonas ni IAM.
        - Sid: SinSesionesNiAutomatizacionesNiDocumentos
          Effect: Deny
          Action:
          - ssm:StartSession
          - ssm:ResumeSession
          - ssm:StartAutomationExecution
          - ssm:CreateDocument
          - ssm:UpdateDocument
          - ssm:UpdateDocumentDefaultVersion
          - ssm:DeleteDocument
          - ssm:ModifyDocumentPermission
          - ssm:CreateAssociation
          - ssm:UpdateAssociation
          - ssm:PutParameter
          - route53:CreateHostedZone
          - route53:DeleteHostedZone
          - route53domains:*
          - organizations:*
          - account:*
          - iam:Create*
          - iam:Delete*
          - iam:Put*
          - iam:Attach*
          - iam:Detach*
          - iam:Update*
          - iam:Add*
          - iam:Remove*
          - iam:Tag*
          - iam:Untag*
          - iam:Set*
          - iam:Upload*
          - iam:Enable*
          - iam:Deactivate*
          - iam:Reset*
          - iam:Change*
          Resource: '*'
        # Deny: la llave primate:managed_by (cualquier mayúscula) sólo nace al crear.
        - Sid: NadieTocaLaLlaveDePropiedadEnRecursosExistentes
          Effect: Deny
          Action:
          - ec2:CreateTags
          - ec2:DeleteTags
          Resource: '*'
          Condition:
            ForAnyValue:StringEqualsIgnoreCase:
              aws:TagKeys:
              - primate:managed_by
            StringNotEquals:
              ec2:CreateAction:
              - RunInstances
              - CreateVolume
              - CreateSecurityGroup
              - AllocateAddress
        # Deny: ningún DeleteTags (uno sin claves borraría la llave sin nombrarla).
        - Sid: NuncaBorrarEtiquetas
          Effect: Deny
          Action: ec2:DeleteTags
          Resource: '*'

  # pcm-prod-provision: montar servidores NUEVOS (siempre con la llave) y
  # operar sólo esos. Todo Allow de escritura exige la etiqueta
  # primate:managed_by=pcm en el pedido o en el recurso.
  PolicyProvision:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: pcm-prod-provision${Sufijo}
      Description: 'PCM: montar SOLO lo nuevo (etiquetado primate:managed_by=pcm).'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        # Lecturas necesarias para montar y operar. Nada escribe.
        - Sid: LecturasParaOperarLoPropio
          Effect: Allow
          Action:
          - sts:GetCallerIdentity
          - ec2:DescribeInstances
          - ec2:DescribeInstanceStatus
          - ec2:DescribeRegions
          - ec2:DescribeAvailabilityZones
          - ec2:DescribeVpcs
          - ec2:DescribeSubnets
          - ec2:DescribeSecurityGroups
          - ec2:DescribeImages
          - ec2:DescribeVolumes
          - ec2:DescribeAddresses
          - ec2:DescribeTags
          - ec2:DescribeInstanceTypes
          - ec2:DescribeKeyPairs
          - ec2:DescribeRouteTables
          - ec2:DescribeInternetGateways
          - route53:GetHostedZone
          - route53:GetChange
          - route53:ListResourceRecordSets
          - cloudwatch:GetMetricData
          - cloudwatch:GetMetricStatistics
          - ssm:DescribeInstanceInformation
          - ssm:GetCommandInvocation
          - ssm:ListCommandInvocations
          - iam:GetInstanceProfile
          Resource: '*'
        # Sólo el parámetro PÚBLICO de Canonical con la AMI de Ubuntu (nada de la cuenta).
        - Sid: AmiPublicaDeCanonical
          Effect: Allow
          Action: ssm:GetParameter
          Resource: arn:aws:ssm:*::parameter/aws/service/canonical/ubuntu/*
        # RunInstances sólo si la instancia y su volumen nacen con la llave.
        - Sid: CrearInstanciaSoloEtiquetadaPorPCM
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:volume/*
          Condition:
            StringEquals:
              aws:RequestTag/primate:managed_by: pcm
        # Lo que RunInstances usa sin crear (AMI, subred, interfaz, SG, key pair).
        - Sid: RecursosAuxiliaresDeRunInstances
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
          - arn:aws:ec2:*::image/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:subnet/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:security-group/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:key-pair/*
        # CreateTags sólo dentro de la creación (ec2:CreateAction).
        - Sid: EtiquetarSoloAlCrear
          Effect: Allow
          Action: ec2:CreateTags
          Resource: '*'
          Condition:
            StringEquals:
              ec2:CreateAction:
              - RunInstances
              - CreateVolume
              - CreateSecurityGroup
              - AllocateAddress
        # Arrancar/parar/reiniciar/terminar SÓLO lo que tiene la llave.
        - Sid: CicloDeVidaSoloDeLoDePCM
          Effect: Allow
          Action:
          - ec2:StartInstances
          - ec2:StopInstances
          - ec2:RebootInstances
          - ec2:TerminateInstances
          - ec2:ModifyInstanceAttribute
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
          Condition:
            StringEquals:
              aws:ResourceTag/primate:managed_by: pcm
        # Crear security groups sólo con la llave.
        - Sid: SecurityGroupPropioEtiquetado
          Effect: Allow
          Action: ec2:CreateSecurityGroup
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:security-group/*
          Condition:
            StringEquals:
              aws:RequestTag/primate:managed_by: pcm
        # (El SG nuevo se crea dentro de una VPC existente.)
        - Sid: SecurityGroupEnLaVpc
          Effect: Allow
          Action: ec2:CreateSecurityGroup
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:vpc/*
        # Abrir puertos sólo en SGs con la llave.
        - Sid: ReglasSoloEnElSecurityGroupDePCM
          Effect: Allow
          Action: ec2:AuthorizeSecurityGroupIngress
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:security-group/*
          Condition:
            StringEquals:
              aws:ResourceTag/primate:managed_by: pcm
        # Reservar Elastic IPs sólo con la llave.
        - Sid: ElasticIpPropia
          Effect: Allow
          Action:
          - ec2:AllocateAddress
          Resource: '*'
          Condition:
            StringEquals:
              aws:RequestTag/primate:managed_by: pcm
        # Asociar EIP sólo entre recursos con la llave.
        - Sid: AsociarEipSoloEntreRecursosDePCM
          Effect: Allow
          Action: ec2:AssociateAddress
          Resource:
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:elastic-ip/*
          - Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
          Condition:
            StringEquals:
              aws:ResourceTag/primate:managed_by: pcm
        - Sid: AsociarEipEnLaInterfazDeLaMaquina
          Effect: Allow
          Action: ec2:AssociateAddress
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
        # Liberar sólo Elastic IPs con la llave (al terminar un servidor de PCM).
        - Sid: LiberarEipSoloDePCM
          Effect: Allow
          Action: ec2:ReleaseAddress
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:elastic-ip/*
          Condition:
            StringEquals:
              aws:ResourceTag/primate:managed_by: pcm
        # Sólo puede pasarle a una EC2 el rol pcm-ssm-role.
        - Sid: PasarSoloElRolDeSSMDePCM
          Effect: Allow
          Action: iam:PassRole
          Resource:
            Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/pcm-ssm-role${Sufijo}
          Condition:
            StringEquals:
              iam:PassedToService: ec2.amazonaws.com
        # El documento de shell para instalar Odoo (la instancia se limita abajo).
        - Sid: ShellDeInstalacionDocumento
          Effect: Allow
          Action: ssm:SendCommand
          Resource: arn:aws:ssm:*:*:document/AWS-RunShellScript
        # ...y sólo sobre instancias con la llave: nunca sobre un servidor ajeno.
        - Sid: ShellDeInstalacionSoloEnMaquinasDePCM
          Effect: Allow
          Action: ssm:SendCommand
          Resource:
            Fn::Sub: arn:aws:ec2:*:${AWS::AccountId}:instance/*
          Condition:
            StringEquals:
              ssm:resourceTag/primate:managed_by: pcm
        - Fn::If:
          - HayZonaDns
          # Sólo con ZonaDns/NombresDns: registros A con esos nombres en esa zona.
          - Sid: DnsSoloNombresDePCMEnLaZonaReal
            Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource:
              Fn::Sub: arn:aws:route53:::hostedzone/${ZonaDns}
            Condition:
              ForAllValues:StringLike:
                route53:ChangeResourceRecordSetsNormalizedRecordNames:
                  Fn::Split:
                  - ','
                  - Ref: NombresDns
              ForAllValues:StringEquals:
                route53:ChangeResourceRecordSetsRecordTypes:
                - A
                route53:ChangeResourceRecordSetsActions:
                - CREATE
                - UPSERT
                - DELETE
          - Ref: AWS::NoValue
        # Crear buckets pcm-<uso>-<esta cuenta> (backups).
        - Sid: CrearBucketsDePCM
          Effect: Allow
          Action: s3:CreateBucket
          Resource:
            Fn::Sub: arn:aws:s3:::pcm-*-${AWS::AccountId}${Sufijo}
        # Listar y lifecycle SÓLO en buckets pcm-<uso>-<cuenta> que sean de ESTA cuenta.
        - Sid: BucketsDePCMDeEstaCuenta
          Effect: Allow
          Action:
          - s3:ListBucket
          - s3:GetLifecycleConfiguration
          - s3:PutLifecycleConfiguration
          Resource:
            Fn::Sub: arn:aws:s3:::pcm-*-${AWS::AccountId}${Sufijo}
          Condition:
            StringEquals:
              aws:ResourceAccount:
                Fn::Sub: ${AWS::AccountId}
        # Leer y borrar objetos SÓLO en esos buckets de esta cuenta (aws:ResourceAccount).
        - Sid: ObjetosDeLosBucketsDePCM
          Effect: Allow
          Action:
          - s3:GetObject
          - s3:DeleteObject
          Resource:
            Fn::Sub: arn:aws:s3:::pcm-*-${AWS::AccountId}${Sufijo}/*
          Condition:
            StringEquals:
              aws:ResourceAccount:
                Fn::Sub: ${AWS::AccountId}
        # Subir dumps SÓLO a incoming/ del bucket pcm-dumps-<cuenta>, de esta cuenta.
        - Sid: SubirDumpsSoloAlBucketDePCM
          Effect: Allow
          Action:
          - s3:PutObject
          - s3:AbortMultipartUpload
          Resource:
            Fn::Sub: arn:aws:s3:::pcm-dumps-${AWS::AccountId}${Sufijo}/incoming/*
          Condition:
            StringEquals:
              aws:ResourceAccount:
                Fn::Sub: ${AWS::AccountId}
        # Deny: la llave primate:managed_by (cualquier mayúscula) sólo nace al crear.
        - Sid: NadieTocaLaLlaveDePropiedadEnRecursosExistentes
          Effect: Deny
          Action:
          - ec2:CreateTags
          - ec2:DeleteTags
          Resource: '*'
          Condition:
            ForAnyValue:StringEqualsIgnoreCase:
              aws:TagKeys:
              - primate:managed_by
            StringNotEquals:
              ec2:CreateAction:
              - RunInstances
              - CreateVolume
              - CreateSecurityGroup
              - AllocateAddress
        # Deny: ningún DeleteTags (uno sin claves borraría la llave sin nombrarla).
        - Sid: NuncaBorrarEtiquetas
          Effect: Deny
          Action: ec2:DeleteTags
          Resource: '*'

  # Usuario de PCM para leer. Sin consola (sin LoginProfile) y sin access
  # keys: las crea un humano en la consola y las carga en PCM.
  UsuarioReadonly:
    Type: AWS::IAM::User
    Properties:
      UserName:
        Fn::Sub: pcm-prod-ro${Sufijo}
      ManagedPolicyArns:
      - Ref: PolicyReadonly

  # Usuario de PCM para montar. Ídem: sin consola y sin access keys.
  UsuarioProvision:
    Type: AWS::IAM::User
    Properties:
      UserName:
        Fn::Sub: pcm-prod-prov${Sufijo}
      ManagedPolicyArns:
      - Ref: PolicyProvision
Outputs:
  Bucket:
    Value:
      Ref: BucketDumps
  DocumentoSSM:
    Value:
      Ref: DocumentoLecturaPCM
  PerfilDeInstancia:
    Value:
      Ref: PerfilSSM
  UsuarioReadonly:
    Value:
      Ref: UsuarioReadonly
  UsuarioProvision:
    Value:
      Ref: UsuarioProvision
